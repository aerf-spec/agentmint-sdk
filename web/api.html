<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Log</title>
<style>
:root { --bg:#fcfcfb; --ink:#1c2530; --ink-2:#3c4654; --muted:#6b7280; --faint:#9aa1ab; --line:#e6e8eb; --code-bg:#f3f4f6; --card:#fff; --allow:#1a7350; --block:#b0392f; --warn:#8a5a00;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14171b; --ink:#e6e9ed; --ink-2:#c3c9d1; --muted:#9aa3ae; --faint:#7b838e; --line:#2b3138; --code-bg:#1d2228; --card:#181c21; --allow:#5cc597; --block:#f08a80; --warn:#e0b25c; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#14171b; --ink:#e6e9ed; --ink-2:#c3c9d1; --muted:#9aa3ae; --faint:#7b838e; --line:#2b3138; --code-bg:#1d2228; --card:#181c21; --allow:#5cc597; --block:#f08a80; --warn:#e0b25c; color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 20px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow-wrap: anywhere; }
a { color: var(--ink-2); text-underline-offset: 3px; }
.app { max-width: 1100px; margin: 0 auto; padding: clamp(32px, 6vw, 56px) 16px 64px; }
header { display: flex; align-items: baseline; gap: 8px 24px; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.brand { font-size: clamp(30px, 5vw, 36px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.stat { color: var(--muted); font-size: 18px; } .stat b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.sp { flex: 1; }
button { font: inherit; font-size: 18px; font-weight: 500; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--muted); }
.log { padding-top: 8px; }
.e { padding: 20px 0; border-bottom: 1px solid var(--line); scroll-margin: 24px; }
.e.target { background: var(--code-bg); border-radius: 8px; padding-left: 12px; padding-right: 12px; }
.line { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; }
.t { color: var(--faint); font-family: var(--mono); font-size: 17px; }
.m { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.o { color: var(--muted); } .p { font-family: var(--mono); font-size: 17px; color: var(--ink); overflow-wrap: anywhere; }
.s { font-family: var(--mono); font-size: 17px; font-weight: 700; } .s.ok { color: var(--allow); } .s.bad { color: var(--block); }
.ms { color: var(--muted); font-size: 17px; }
.tag { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.tag.live { color: var(--allow); }
.bodies { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; margin-top: 10px; }
.b { background: var(--code-bg); border-radius: 8px; padding: 12px 16px; min-width: 0; }
.b h4 { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.55 var(--mono); color: var(--ink-2); }
.k { color: var(--muted); }
.str { color: var(--allow); } .num, .bool { color: var(--ink); }
.empty { color: var(--muted); padding: 24px 0; }
@media (max-width: 800px) { .bodies { grid-template-columns: 1fr; } }
@media (max-width: 600px) { body { font-size: 19px; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Network log</div>
    <span class="stat">Requests: <b id="n">0</b></span>
    <span class="stat">Public log size: <b id="size">–</b></span>
    <span class="stat" id="mode"></span>
    <span class="sp"></span>
    <button id="restart" type="button">Restart</button>
    <a href="index.html">Back to the call</a>
  </header>
  <main class="log" id="log"><div class="empty" id="empty">Waiting…</div></main>
</div>
<script>
const AUTH = "https://filet-authority.anikethsubs.workers.dev";
const ORIGIN = AUTH.replace("https://", "");
const log = document.getElementById("log");
const nEl = document.getElementById("n");
const sizeEl = document.getElementById("size");
let count = 0, timers = [], lastLiveSize = null;

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const short = (h) => (typeof h === "string" && /^[0-9a-f]{40,}$/.test(h) ? h.slice(0, 12) + "…" : h);
function shorten(v) {
  if (Array.isArray(v)) return v.length > 4 ? [...v.slice(0, 3).map(shorten), `… ${v.length - 3} more`] : v.map(shorten);
  if (v && typeof v === "object") return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, shorten(x)]));
  return short(v);
}
function pretty(obj) {
  return esc(JSON.stringify(shorten(obj), null, 2))
    .replace(/&quot;|"/g, '"')
    .replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="str">"$1"</span>')
    .replace(/: (-?\d+(\.\d+)?)/g, ': <span class="num">$1</span>')
    .replace(/: (true|false)/g, ': <span class="bool">$1</span>');
}
function add({ id, t, method, origin, path, status, ms, req, res, live }) {
  document.getElementById("empty")?.remove();
  const el = document.createElement("div");
  el.className = "e"; if (id) el.id = id;
  el.innerHTML =
    `<div class="line"><span class="t">${esc(t)}</span><span class="m ${method}">${method}</span>` +
    `<span class="o">${esc(origin)}</span><span class="p">${esc(path)}</span>` +
    `<span class="s ${status < 400 ? "ok" : "bad"}">${status}</span>` +
    (ms != null ? `<span class="ms">${ms} ms</span>` : "") +
    `<span class="tag ${live ? "live" : ""}">${live ? "live" : "recorded"}</span></div>` +
    `<div class="bodies"><div class="b"><h4>Sent</h4><pre>${req ? pretty(req) : "—"}</pre></div>` +
    `<div class="b"><h4>Received</h4><pre>${res ? pretty(res) : "—"}</pre></div></div>`;
  log.appendChild(el);
  nEl.textContent = ++count;
  if (location.hash && location.hash.slice(1) === id) { el.classList.add("target"); el.scrollIntoView({ block: "center" }); }
  else if (log.scrollHeight - log.scrollTop - log.clientHeight < 200) log.scrollTop = log.scrollHeight;
}
const clock = (us) => { const s = (us || 0) / 1e6; return `${String(Math.floor(s / 60)).padStart(2, "0")}:${(s % 60).toFixed(1).padStart(4, "0")}`; };

// Turns recorded call events into the HTTP requests they correspond to.
function toRequests(events) {
  const out = []; let keyId = "";
  for (const ev of events) {
    const d = ev.data || {}; const name = ev.event;
    if (name === "start") {
      keyId = d.issuer_key_id || d.key_id || "";
      out.push({ id: `a-${ev.id}`, t: clock(d.t_us), method: "POST", origin: ORIGIN, path: "/authority/v1/issuers", status: 200,
        req: { public_key_pem: "-----BEGIN PUBLIC KEY----- …" }, res: { key_id: keyId } });
    } else if (name === "loop") {
      out.push({ id: `a-${ev.id}`, t: clock(d.t_us), method: "POST", origin: "api.anthropic.com", path: "/v1/messages", status: 200, ms: d.ms,
        req: { model: d.model || "claude-opus-5-5", turn: d.turn, iteration: d.iteration, stream: true },
        res: { request_id: d.request_id, stop_reason: d.stop_reason, usage: { input_tokens: d.input_tokens, output_tokens: d.output_tokens, cache_read_input_tokens: d.cache_read_tokens } } });
    } else if (name === "batch") {
      out.push({ id: `a-${ev.id}`, t: clock(d.t_us), method: "POST", origin: ORIGIN, path: "/authority/v1/batches", status: 200, ms: d.authority_ms,
        req: { key_id: keyId, leaf_hashes: d.leaf_hashes, batch_signature: "…" },
        res: { tree_size_before: d.tree_size_before, tree_size_after: d.tree_size_after, sth: d.sth, sth_signature: d.sth_signature, proofs: `${(d.leaf_hashes || []).length} inclusion proof(s)` },
        size: d.tree_size_after });
    } else if (name === "consistency") {
      out.push({ id: `a-${ev.id}`, t: clock(d.t_us), method: "GET", origin: ORIGIN, path: `/authority/v1/consistency?from=${d.from_size}&to=${d.to_size}`, status: d.ok === false ? 409 : 200,
        req: null, res: { from: d.from_size, to: d.to_size, ok: d.ok } });
    } else if (name === "api") {
      out.push({ id: `a-${ev.id}`, t: clock(d.t_us), method: d.method, origin: (d.url || "").replace(/^https?:\/\/([^/]+).*/, "$1"), path: (d.url || "").replace(/^https?:\/\/[^/]+/, ""),
        status: d.status, ms: d.ms, req: d.request_summary, res: d.response_summary });
    }
  }
  return out;
}

async function run() {
  timers.forEach(clearTimeout); timers = [];
  log.innerHTML = '<div class="empty" id="empty">Waiting…</div>'; count = 0; nEl.textContent = 0;
  let events = [];
  try {
    const j = await (await fetch("/events.json", { cache: "no-store" })).json();
    const runs = j.runs || {}; const first = runs.none || runs[Object.keys(runs)[0]];
    events = Array.isArray(first) ? first : (first?.events || []);
  } catch (e) {}
  document.getElementById("mode").innerHTML = '<span class="tag">Recorded call</span>';
  const reqs = toRequests(events);
  // Show everything immediately if the page was opened on a specific request; otherwise play it in.
  const instant = !!location.hash;
  reqs.forEach((r, i) => {
    const show = () => { add(r); if (r.size != null) sizeEl.textContent = r.size; };
    if (instant) show(); else timers.push(setTimeout(show, 900 * i));
  });
}

// The real authority: poll its signed tree head and log every change.
async function pollLive() {
  try {
    const t0 = performance.now();
    const res = await fetch(`${AUTH}/authority/v1/sth`, { cache: "no-store" });
    const body = await res.json();
    const ms = Math.round(performance.now() - t0);
    const size = body?.sth?.tree_size;
    if (size !== lastLiveSize) {
      lastLiveSize = size;
      add({ id: `live-${Date.now()}`, t: new Date().toLocaleTimeString(), method: "GET", origin: ORIGIN, path: "/authority/v1/sth",
        status: res.status, ms, req: null, res: body, live: true });
    }
  } catch (e) {}
}

// Live call: /api.html?call=<id> streams that call's real requests from filet-call.
const CALL_API = "https://filet-call.anikethsubs.workers.dev";
function runLive(callId) {
  log.innerHTML = '<div class="empty" id="empty">Connecting…</div>'; count = 0; nEl.textContent = 0;
  document.getElementById("mode").innerHTML = `<span class="tag live">Live call ${esc(callId.slice(0, 8))}</span>`;
  const es = new EventSource(`${CALL_API}/call/${encodeURIComponent(callId)}/events`);
  const names = ["start", "loop", "batch", "consistency", "api"];
  for (const name of names) {
    es.addEventListener(name, (m) => {
      let data; try { data = JSON.parse(m.data); } catch (e) { return; }
      for (const r of toRequests([{ id: m.lastEventId, event: name, data }])) {
        // The api event is the real request record; skip the derived duplicates when it exists.
        if (name !== "api" && data.request_id === undefined && name !== "start" && name !== "loop") { /* keep derived */ }
        add({ ...r, live: true });
        if (r.size != null) sizeEl.textContent = r.size;
      }
    });
  }
  es.addEventListener("done", () => es.close());
}

document.getElementById("restart").addEventListener("click", () => { history.replaceState(null, "", location.pathname); run(); });
const liveCall = new URLSearchParams(location.search).get("call");
if (liveCall) runLive(liveCall); else run();
pollLive(); setInterval(pollLive, 4000);
</script>
</body>
</html>
