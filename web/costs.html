<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Costs</title>
<style>
:root { --bg:#fffdf8; --fg:#1a1a1a; --mute:#555; --line:#ddd6c8; --card:#fff; --hl:#f3ecdc; --ok:#1d6b2f; --bad:#a3221b; --warn:#7a5200;
  --serif: Georgia, "Times New Roman", serif; --mono: Menlo, Consolas, "Liberation Mono", monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161513; --fg:#f2efe8; --mute:#b5b0a5; --line:#3a3731; --card:#1f1e1b; --hl:#2a2822; --ok:#7fd18f; --bad:#ff8a80; --warn:#e8c170; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#161513; --fg:#f2efe8; --mute:#b5b0a5; --line:#3a3731; --card:#1f1e1b; --hl:#2a2822; --ok:#7fd18f; --bad:#ff8a80; --warn:#e8c170; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 21px/1.6 var(--serif); overflow-wrap: anywhere; }
a { color: inherit; }
.top { max-width: 820px; margin: 0 auto; padding: 28px 16px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.brand { font-size: 32px; font-weight: bold; } .sub { color: var(--mute); }
main { max-width: 820px; margin: 0 auto; padding: 8px 16px 64px; }
.lbl { display: block; font-size: 24px; font-weight: bold; margin: 28px 0 10px; }
.call { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 12px 18px; margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
.usd { margin-left: auto; font-weight: bold; }
.k { color: var(--mute); } .v { overflow-wrap: anywhere; }
.sum { font-size: 24px; font-weight: bold; }
.empty { color: var(--mute); }
</style>
</head>
<body>
<header class="top"><span class="brand">Costs</span><a class="sub" href="index.html">Back to the call</a></header>
<main>
  <span class="lbl">Live calls</span>
  <div id="list"><p class="empty">…</p></div>
  <span class="lbl">Total</span>
  <div class="sum" id="sum">–</div>
</main>
<script>
"use strict";
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const usd = (v) => `$${Number(v || 0).toFixed(4)}`;
let api = null;
try { const a = JSON.parse(localStorage.getItem("filet.v3.api") || "null"); api = a === "off" ? null : a; } catch {}
api = api || "https://filet-call.anikethsubs.workers.dev";
(async () => {
  const list = document.getElementById("list");
  try {
    const r = await fetch(`${api}/calls/costs`);
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();
    const calls = Array.isArray(d) ? d : d.calls || [];
    list.replaceChildren();
    if (!calls.length) list.append(h("p", "empty", "no live calls"));
    for (const c of calls) {
      const el = h("div", "call"); const row = h("div", "row");
      row.append(h("span", "v", String(c.started_at || c.date || "").replace("T", " ").slice(0, 16)), h("span", "k", `${c.turns ?? "?"} turns`), h("span", "usd", usd(c.usd ?? c.total_usd)));
      el.append(row);
      for (const [m, v] of Object.entries(c.by_model || {})) { const r2 = h("div", "row"); r2.append(h("span", "k", m), h("span", "v", usd(v))); el.append(r2); }
      if (c.id) { const a = h("a", null, c.id); a.href = `api.html?call=${encodeURIComponent(c.id)}`; el.append(a); }
      list.append(el);
    }
    const total = d.total_usd ?? calls.reduce((s, c) => s + (c.usd ?? c.total_usd ?? 0), 0);
    document.getElementById("sum").textContent = `${usd(total)} · ${calls.length} calls`;
  } catch { list.replaceChildren(h("p", "empty", "costs unavailable")); }
})();
</script>
</body>
</html>
