<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Costs</title>
<style>
:root { --bg:#fcfcfb; --ink:#1c2530; --ink-2:#3c4654; --muted:#6b7280; --faint:#9aa1ab; --line:#e6e8eb; --code-bg:#f3f4f6; --card:#fff; --allow:#1a7350; --block:#b0392f; --warn:#8a5a00;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14171b; --ink:#e6e9ed; --ink-2:#c3c9d1; --muted:#9aa3ae; --faint:#7b838e; --line:#2b3138; --code-bg:#1d2228; --card:#181c21; --allow:#5cc597; --block:#f08a80; --warn:#e0b25c; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#14171b; --ink:#e6e9ed; --ink-2:#c3c9d1; --muted:#9aa3ae; --faint:#7b838e; --line:#2b3138; --code-bg:#1d2228; --card:#181c21; --allow:#5cc597; --block:#f08a80; --warn:#e0b25c; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 20px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow-wrap: anywhere; }
a { color: var(--ink-2); text-underline-offset: 3px; }
.top { max-width: 820px; margin: 0 auto; padding: clamp(32px, 6vw, 56px) 16px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.brand { font-size: clamp(30px, 5vw, 36px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; } .sub { color: var(--muted); }
main { max-width: 820px; margin: 0 auto; padding: 8px 16px 64px; }
.lbl { display: block; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 32px 0 12px; }
.call { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 14px 18px; margin-bottom: 12px; }
.call a { font-family: var(--mono); font-size: 16px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
.usd { margin-left: auto; font-family: var(--mono); font-weight: 600; }
.k { color: var(--muted); } .v { overflow-wrap: anywhere; }
.sum { font-size: 24px; font-weight: 600; font-family: var(--mono); }
.empty { color: var(--muted); }
@media (max-width: 600px) { body { font-size: 19px; } }
</style>
</head>
<body>
<header class="top"><span class="brand">Costs</span><a class="sub" href="index.html">Back to the call</a></header>
<main>
  <span class="lbl">Live calls</span>
  <div id="list"><p class="empty">…</p></div>
  <span class="lbl">Total</span>
  <div class="sum" id="sum">–</div>
</main>
<script>
"use strict";
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const usd = (v) => `$${Number(v || 0).toFixed(4)}`;
let api = null;
try { const a = JSON.parse(localStorage.getItem("filet.v3.api") || "null"); api = a === "off" ? null : a; } catch {}
api = api || "https://filet-call.anikethsubs.workers.dev";
(async () => {
  const list = document.getElementById("list");
  try {
    const r = await fetch(`${api}/calls/costs`);
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();
    const calls = Array.isArray(d) ? d : d.calls || [];
    list.replaceChildren();
    if (!calls.length) list.append(h("p", "empty", "no live calls"));
    for (const c of calls) {
      const el = h("div", "call"); const row = h("div", "row");
      row.append(h("span", "v", String(c.started_at || c.date || "").replace("T", " ").slice(0, 16)), h("span", "k", `${c.turns ?? "?"} turns`), h("span", "usd", usd(c.usd ?? c.total_usd)));
      el.append(row);
      for (const [m, v] of Object.entries(c.by_model || {})) { const r2 = h("div", "row"); r2.append(h("span", "k", m), h("span", "v", usd(typeof v === "object" && v ? v.usd : v))); el.append(r2); }
      if (c.id) { const a = h("a", null, c.id); a.href = `api.html?call=${encodeURIComponent(c.id)}`; el.append(a); }
      list.append(el);
    }
    const total = d.total_usd ?? calls.reduce((s, c) => s + (c.usd ?? c.total_usd ?? 0), 0);
    document.getElementById("sum").textContent = `${usd(total)} · ${calls.length} calls`;
  } catch { list.replaceChildren(h("p", "empty", "costs unavailable")); }
})();
</script>
</body>
</html>
