<!doctype html>
<!-- copy slots (data-copy): subtitle, col-model, col-call, col-filet, authority, empty-model, empty-call, empty-filet -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>filet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%233B82F6%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* agentmint.run palette: dark only, by design */
:root {
  --bg: #0B1120; --fg: #E2E8F0; --fg-2: #CBD5E1; --surface: #141E30; --border: #1E3A5F; --code-bg: #0D1117;
  --blue: #3B82F6; --green: #10B981; --red: #EF4444; --yellow: #FBBF24;
  --text-secondary: #94A3B8; --text-tertiary: #475569; --faint: #64748B; --off: #26354B;
  --hl: rgba(59, 130, 246, 0.26); --hl-soft: rgba(59, 130, 246, 0.10);
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --serif: "Source Serif 4", Georgia, serif;
  --pad: clamp(12px, 1.7vw, 24px);
  --gut: 14px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.7 var(--serif); -webkit-font-smoothing: antialiased; }
button, select, input { font: 500 12px var(--mono); color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
[data-copy]:empty { display: none; }
[hidden] { display: none !important; }
.lbl { font: 600 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); }
.tag { font: 500 10px var(--mono); letter-spacing: 0.04em; color: var(--faint); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; margin-left: 6px; text-transform: none; }
.t { font: 400 10.5px var(--mono); color: var(--faint); white-space: nowrap; }
.ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--yellow); }

/* shell: slim header, panes fill the viewport */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: var(--pad) max(var(--pad), env(safe-area-inset-right)) var(--pad) max(var(--pad), env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px 14px; min-height: 36px; max-height: 48px; }
.brand { font: 700 15px var(--mono); white-space: nowrap; }
.brand span { color: var(--blue); }
.mode { font: 500 10.5px var(--mono); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.mode[data-live="1"] { color: var(--green); border-color: rgba(16, 185, 129, 0.4); }
.clock { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); min-width: 5ch; }
.cost { font: 500 11.5px var(--mono); color: var(--fg-2); text-decoration: none; white-space: nowrap; }
.cost:hover { color: var(--blue); }
.ih .usd { color: var(--fg-2); margin-left: 8px; }
.ctl { display: flex; align-items: center; gap: 6px; flex: none; }
.btn { font: 500 12px var(--mono); padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none; line-height: 1.4; }
.btn--play { background: var(--blue); border-color: var(--blue); color: #fff; min-width: 5.4rem; }
.more { position: relative; }
.more > summary { list-style: none; cursor: pointer; padding: 3px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font: 600 14px var(--mono); line-height: 1.3; }
.more > summary::-webkit-details-marker { display: none; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: min(19rem, 86vw); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: grid; gap: 10px; font: 12px/1.5 var(--mono); }
.menu label { display: grid; gap: 4px; }
.menu select, .menu input { width: 100%; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
.menu .row { display: flex; gap: 6px; }
.menu .row input { flex: 1; min-width: 0; }
.saved { display: grid; gap: 2px; }
.saved button { text-align: left; background: none; border: 0; color: var(--blue); cursor: pointer; padding: 2px 0; }
.err { font: 600 11px var(--mono); color: var(--red); white-space: nowrap; }
.scrub { position: relative; flex: 1; min-width: 80px; height: 22px; cursor: pointer; touch-action: none; }
.scrub .track { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--border); border-radius: 1px; }
.scrub .fill { position: absolute; left: 0; top: 10px; height: 2px; background: var(--blue); border-radius: 1px; width: 0; }
.scrub .head { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--fg); left: 0; pointer-events: none; }
.scrub .tk { position: absolute; top: 4px; width: 2px; height: 14px; margin-left: -1px; background: var(--text-tertiary); border: 0; padding: 0; cursor: pointer; }
.scrub .tk.f { background: var(--red); width: 3px; }

/* layout: side panels + centered conversation */
.cols { display: grid; grid-template-columns: var(--wl, 30vw) var(--gut) minmax(320px, 1fr) var(--gut) var(--wr, 30vw); min-height: 0; }
.side { position: relative; background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.rail { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 14px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text-tertiary); font: 600 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; text-align: left; }
.rail:hover { color: var(--fg); }
.rail .chev { font-size: 12px; letter-spacing: 0; }
.side.collapsed > :not(.rail) { display: none !important; }
.side.collapsed .rail { height: 100%; border-bottom: 0; writing-mode: vertical-rl; justify-content: flex-start; padding: 14px 0; align-items: center; }
.center { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pane { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.feed { flex: 1; overflow-y: auto; min-height: 0; padding: 10px 18px 28px; font: 12.5px/1.6 var(--mono); color: var(--text-secondary); overscroll-behavior: contain; overflow-anchor: auto; overflow-wrap: anywhere; }
.chat { padding: 18px max(18px, calc((100% - 720px) / 2)) 28px; }
.gutter { cursor: col-resize; display: flex; justify-content: center; touch-action: none; }
.gutter::after { content: ""; width: 2px; border-radius: 1px; background: transparent; transition: background-color 150ms var(--ease); }
.gutter:hover::after, .gutter.drag::after { background: var(--border); }
.gutter:focus-visible { outline: none; } .gutter:focus-visible::after { background: var(--blue); }
.gutter.off { pointer-events: none; }
.hgut { flex: none; height: 10px; cursor: row-resize; display: flex; align-items: center; touch-action: none; }
.hgut::after { content: ""; flex: 1; height: 2px; margin: 0 14px; border-radius: 1px; background: var(--border); opacity: 0.5; }
.hgut:hover::after, .hgut.drag::after, .hgut:focus-visible::after { background: var(--blue); opacity: 1; }
.hgut:focus-visible { outline: none; }
.pill { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--blue); background: var(--surface); color: var(--fg); font: 600 11px var(--mono); cursor: pointer; }
.am-top { flex: none; padding: 8px 18px 2px; font: 11.5px var(--mono); }
.termd { flex: none; border-top: 1px solid var(--border); }
.termd > summary { list-style: none; cursor: pointer; padding: 6px 14px; font: 500 11px var(--mono); color: var(--text-tertiary); }
.termd > summary::-webkit-details-marker { display: none; }
.termd > summary::before { content: "▸ "; } .termd[open] > summary::before { content: "▾ "; }
.termd > summary:hover { color: var(--fg); }
@media (max-width: 900px) {
  .app { height: auto; }
  .top { flex-wrap: wrap; max-height: none; }
  .scrub { order: 10; flex-basis: 100%; }
  .cols { grid-template-columns: 1fr; gap: 14px; }
  .center { order: -1; min-height: 70vh; }
  .gutter, .hgut { display: none; }
  .side { max-height: 85vh; }
  .side:not(.collapsed) { min-height: 60vh; }
  .side.collapsed .rail { writing-mode: horizontal-tb; height: auto; padding: 8px 14px; }
}

/* parts, tethers, flash */
.part { border-radius: 4px; cursor: default; transition: background-color 150ms var(--ease); }
.part:hover { background: var(--hl-soft); }
.part.rel { background: var(--hl); }
.flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0%, 40% { background: var(--hl); box-shadow: 0 0 0 1.5px var(--blue); } 100% { background: transparent; box-shadow: 0 0 0 0 transparent; } }
.jp { display: inline-block; white-space: nowrap; opacity: 0; padding: 0 3px; margin-left: 3px; color: var(--blue); text-decoration: none; font: 600 11px var(--mono); transition: opacity 150ms var(--ease); }
.part:hover > .jp, .part:focus-within > .jp, .part:focus > .jp { opacity: 1; }
.jp:focus-visible { opacity: 1; }
#tether { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 30; }
#tether line { stroke: var(--blue); stroke-width: 1; opacity: 0.85; transition: opacity 400ms var(--ease); }
#tether.fade line { opacity: 0; }
.enter { animation: enter 180ms var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

/* conversation */
.turn { display: block; padding: 6px 10px; margin: 0 -10px 18px; }
.turn .who { display: block; font: 600 10.5px var(--mono); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; }
.turn[data-who="agent"] .who { color: var(--blue); }
.turn .tx { display: block; font: 17px/1.6 var(--serif); color: var(--fg); white-space: pre-wrap; }
.say { flex: none; padding: 8px max(12px, calc((100% - 720px) / 2)) 4px; }
.composer { position: relative; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); padding: 12px 54px 12px 14px; transition: border-color 150ms var(--ease); }
.composer:focus-within { border-color: var(--blue); }
.composer textarea { display: block; width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--fg); font: 15px/1.5 var(--serif); height: 3em; min-height: 3em; max-height: 12em; overflow-y: auto; }
.composer textarea::placeholder { color: var(--faint); }
.composer .note { display: block; margin-top: 4px; font: 500 11px var(--mono); color: var(--yellow); }
.send { position: absolute; right: 10px; bottom: 10px; width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--blue); color: #fff; font: 700 15px var(--mono); cursor: pointer; }
.send[data-stop="1"] { background: var(--surface); border: 1px solid var(--border); color: var(--fg); font-size: 12px; }

/* model tree */
.rules { margin-bottom: 18px; }
.node { display: block; padding: 1px 6px; margin: 0 -6px; }
.kids { margin-left: 8px; padding-left: 12px; border-left: 1px solid var(--border); }
.card { padding: 0 0 22px; }
.hd { display: block; padding: 2px 6px; margin: 0 -6px; }
.hd b { font: 600 12px var(--mono); color: var(--fg); letter-spacing: 0.04em; }
.hd .pt { color: var(--text-secondary); margin-left: 8px; }
.k { color: var(--faint); }
.v { color: var(--fg-2); }
.ih .in { color: var(--blue); font-weight: 600; }
.ih .il { color: var(--fg); }
.sr[data-s="timeout"] { color: var(--yellow); } .sr[data-s="end_turn"] { color: var(--green); }
.think { display: block; font: 15px/1.65 var(--serif); color: var(--fg-2); padding: 2px 6px; margin: 0 -6px; }
.think .part { text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
.caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--blue); opacity: 0.55; border-radius: 1px; }
.claim .cid { color: var(--faint); margin-right: 6px; }
.claim .ct { font: 14.5px/1.55 var(--serif); color: var(--fg); }
.claim.unsup .ct, .claim.unsup .cid { color: var(--yellow); }
.claim.final .cid { color: var(--blue); }
.cite { display: block; color: var(--text-secondary); padding: 0 6px; margin: 0 -6px; }
.cite::before { content: "↳ "; color: var(--faint); }
.cite[data-kind="rule"] .cv { color: var(--blue); } .cite[data-kind="tool"] .cv { color: var(--green); }
.cite.warn { color: var(--yellow); }
.tn { color: var(--green); }
.pending { color: var(--faint); }
.srow .sk { color: var(--faint); margin-right: 6px; }
.srow .sn { color: var(--fg-2); }
.srow .sd { color: var(--fg); margin-left: 6px; }
.srow.err .sk, .srow.err .sn { color: var(--yellow); }
.pol { color: var(--text-secondary); }
.pol::before { content: attr(data-pol) " "; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }

/* failure story */
.story { display: block; margin: 10px -6px; padding: 4px 6px 6px; }
.story .sh b { font-weight: 600; margin-right: 8px; }
.story .st { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; }
.story[data-state="recovering"] .sh { color: var(--yellow); }
.story[data-state="recovered"] .sh { color: var(--green); }
.story[data-state="failed"] .sh { color: var(--red); }
.story ol { list-style: none; margin: 2px 0 0 8px; padding-left: 12px; border-left: 1px solid var(--border); }
.story li { color: var(--fg-2); }
.story li:last-child { color: var(--fg); }

/* filet column */
.aline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 4px; color: var(--text-tertiary); min-height: 20px; }
.aline .tick { align-self: center; width: 6px; height: 6px; border-radius: 50%; background: var(--off); }
.aline.live .tick { background: var(--green); animation: tick 250ms steps(2, jump-none) infinite; }
@keyframes tick { from { opacity: 1; } to { opacity: 0.2; } }
.tok { padding: 0 3px; white-space: nowrap; }
.tok:not([hidden]) ~ .tok:not([hidden])::before { content: "· "; color: var(--text-tertiary); }
.tok .tv { display: inline-block; color: var(--fg); }
.tok.warn .tv { color: var(--yellow); }
.tv.bump { animation: bump 250ms var(--ease) both; }
@keyframes bump { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
.rcpt { font: 12.5px/1.65 var(--mono); margin: 0 0 24px; color: var(--fg); scroll-margin: 24px; }
.rcpt .br, .rcpt .pn { color: var(--text-tertiary); }
.jl { display: block; padding-left: 2ch; }
.jk { color: var(--text-tertiary); }
.js { position: relative; color: var(--fg); padding: 0 2px; margin: 0 -2px; }
.js > .jp, .tok > .jp { position: absolute; left: 100%; top: 0; margin: 0; }
.tok { position: relative; }
.js.pend { color: var(--faint); }
.js.bad, .js.warn { color: var(--yellow); }
.js.rec { color: var(--green); }
.ckb { border: 0; background: none; padding: 0 0 0 8px; font: 500 11px var(--mono); color: var(--blue); cursor: pointer; }
.ckb.ok { color: var(--green); } .ckb.bad { color: var(--red); }
.summary { display: block; font: 600 12px var(--mono); margin: 4px 0 20px; }

/* terminal */
.term { height: var(--th, 200px); margin: 0 12px 12px; border-radius: 8px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; position: relative; }
.tbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 10px; font: 11px/1.6 var(--mono); color: var(--text-secondary); overflow-wrap: anywhere; white-space: pre-wrap; }
.tl { display: block; padding: 0 3px; margin: 0 -3px; }
.tl .tp { color: var(--text-tertiary); }
.tl .cmd { color: var(--fg-2); }
.tl .tr { display: block; color: var(--text-secondary); padding-left: 2ch; }
.tl.warn .tr { color: var(--yellow); } .tl.bad .tr { color: var(--red); } .tl.ok .tr { color: var(--green); }
.tl .go { color: var(--faint); text-decoration: none; margin-left: 6px; }
.tl .go:hover { color: var(--blue); }

/* thread modal */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(5, 9, 18, 0.72); display: flex; align-items: center; justify-content: center; padding: 24px; }
.mbox { width: min(720px, 100%); max-height: min(86vh, 900px); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.mhd { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font: 600 12px var(--mono); }
.mhd .mt { flex: 1; color: var(--fg); }
.mbody { flex: 1; overflow-y: auto; padding: 14px 18px 24px; font: 12.5px/1.6 var(--mono); color: var(--text-secondary); overflow-wrap: anywhere; }
.mn { display: block; text-decoration: none; padding: 2px 6px; margin: 0 -6px 2px; border-radius: 4px; scroll-margin: 40px; }
.mn:hover { background: var(--hl-soft); }
.mn .lbl { display: block; }
.mn pre, .mn .mx { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 var(--mono); color: var(--fg-2); }
.mn .ms { font: 15px/1.6 var(--serif); color: var(--fg); }
.msec { margin: 0 0 10px 0; padding-left: 12px; border-left: 1px solid var(--border); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">filet<span>.ai</span></span>
    <span class="mode" id="mode" hidden></span>
    <span class="clock" id="clock" hidden></span>
    <a class="cost" id="cost" href="costs.html" target="_blank" rel="noopener" hidden></a>
    <p data-copy="subtitle"></p>
    <div class="scrub rec-only" id="scrub" aria-label="Timeline"><div class="track"></div><div class="fill" id="fill"></div><div id="ticks"></div><div class="head" id="head"></div></div>
    <span class="err" id="err" role="status" hidden></span>
    <div class="ctl">
      <button class="btn rec-only" id="prev" type="button" aria-label="Previous step">←</button>
      <button class="btn btn--play rec-only" id="play" type="button">Play</button>
      <button class="btn rec-only" id="next" type="button" aria-label="Next step">→</button>
      <button class="btn" id="endcall" type="button" hidden>End call</button>
      <a class="btn" id="apilink" href="api.html" target="_blank" rel="noopener">API</a>
      <a class="btn" id="pkglink" href="package.html" target="_blank" rel="noopener" hidden>Package</a>
      <details class="more" id="more">
        <summary aria-label="More">⋯</summary>
        <div class="menu">
          <label><span class="lbl">Run</span>
            <select id="run">
              <option value="">recorded call</option>
              <option value="llm_timeout">recorded · llm_timeout</option>
              <option value="tool_error">recorded · tool_error</option>
              <option value="authority_down">recorded · authority_down</option>
              <option value="signer_crash">recorded · signer_crash</option>
            </select>
          </label>
          <button class="btn" id="newcall" type="button">New call</button>
          <label><span class="lbl">Speed</span><select id="speed"><option value="1">normal</option><option value="3">fast</option></select></label>
          <label><span class="lbl">API</span><span class="row"><input id="api" type="url" placeholder="https://…" spellcheck="false"><button class="btn" id="api-save" type="button">Save</button></span></label>
          <div><span class="lbl">Saved calls</span><div class="saved" id="saved"></div></div>
        </div>
      </details>
    </div>
  </header>

  <main class="cols" id="cols">
    <section class="side" id="side-l" data-pane="model" aria-label="Model">
      <button class="rail" type="button" data-toggle="l" aria-expanded="true" title="Model ( [ )"><span>Model</span><span class="chev">‹</span></button>
      <p data-copy="col-model"></p>
      <div class="pane"><div class="feed" id="model"><p data-copy="empty-model"></p></div></div>
    </section>
    <div class="gutter" role="separator" aria-orientation="vertical" aria-label="Resize Model panel" tabindex="0" data-g="l"></div>
    <section class="center" data-pane="call" aria-label="Conversation">
      <p data-copy="col-call"></p>
      <div class="pane"><div class="feed chat" id="call"><p data-copy="empty-call"></p></div></div>
      <form class="say" id="say" autocomplete="off"><div class="composer"><textarea id="say-in" rows="2" placeholder="Speak as the caller…" aria-label="Speak as the caller"></textarea><span class="note" id="say-note" hidden>connect live to reply</span><button class="send" id="say-go" type="submit" aria-label="Send">↑</button></div></form>
    </section>
    <div class="gutter" role="separator" aria-orientation="vertical" aria-label="Resize filet panel" tabindex="0" data-g="r"></div>
    <section class="side" id="side-r" data-pane="filet" aria-label="filet">
      <button class="rail" type="button" data-toggle="r" aria-expanded="true" title="filet ( ] )"><span>filet</span><span class="chev">›</span></button>
      <p data-copy="col-filet"></p>
      <div class="am-top"><div class="aline" id="aline"></div><p data-copy="authority"></p></div>
      <div class="pane"><div class="feed" id="am"><p data-copy="empty-filet"></p></div></div>
      <details class="termd" id="termd"><summary id="termsum">terminal</summary>
        <div class="hgut" id="hgut" role="separator" aria-orientation="horizontal" aria-label="Resize terminal" tabindex="0"></div>

// ── view state ──

// ── follow: only while the pane sits at the bottom ──

  c.userAt = 0;

// ── status strip: lights only from server data ──
const LIGHTS = [["salted", "salted"], ["key_isolated", "key isolated"], ["anchored", "anchored"], ["reconciled", "requests matched"], ["leak_scan", "leak scan"], ["no_gaps", "no gaps"]];
function buildStrip() {}
function light(k, s) {

}
function anchCount() {

  if (tot) { setTok("tk-a", `${ok}/${tot}`, [...S.rec.values()].map((r) => `anc:${r.seq}`)); $("#tk-a").classList.toggle("warn", S.delayedAny && ok < tot); }
}

// ── authority line ──
function tok(id, label, keys) { const e = part("span", "tok", null, { keys }); e.id = id; e.hidden = true; e.append(`${label} `, h("span", "tv", "")); return e; }

// ── terminal ──
function term(cmd, resp, keys, cls = "", api = null, id = null) {

}

// ── model column: turn → iteration → thinking → claims → tool_use → tool_result → spans ──
function ensureStep(n, t) {
  if (S.steps.has(n)) return S.steps.get(n);
  const st = { n, thinking: "", spans: new Map(), failBySpan: new Map(), iters: [], cur: 0, loops: [] };
  clearEmpty(cols.model);
  const mc = enter(h("article", "card"));
  st.mHead = part("div", "hd", null, { keys: [`step:${n}`], id: `s-${n}`, step: n });
  st.mHead.append(h("b", null, `STEP ${n + 1}`), st.mPoint = h("span", "pt"));
  st.kids = h("div", "kids");
  st.mInput = h("div"); st.mLoop = h("div"); st.mFail = h("div"); st.mStack = h("div");
  st.kids.append(st.mInput, st.mLoop, st.mFail, st.mStack);

}

  hd.append(h("span", "in", `#${i} `), h("span", "il", "model call"));

}
const lastIter = (st) => st.iters[st.cur] || iter(st, 1);
const openIter = (st) => { const it = lastIter(st); return it.done ? iter(st, st.cur + 1) : it; };
function renderThinking(st, it, final) {

    const lab = h("div", "lbl", "Thinking"); lab.append(h("span", "tag", S.thinkingKind || (live() ? "summary" : "scripted")));
    it.thinkEl = part("div", "think", null, { keys: [`think:${st.n}`], id: st.thinkId ? null : `s-${st.n}-think`, step: st.n });

function citeKey(n, c) { return c.kind === "rule" ? `rule:${c.ref}` : c.kind === "tool" ? `tr:${n}:${c.ref}` : c.kind === "turn" ? `at:${c.ref}` : c.kind === "claim" ? `claim:${n}:${c.ref}` : `cite:${c.ref}`; }

}
function renderClaims(st, claims) {

  const sec = enter(h("div"));
  const lab = h("div", "lbl", "Claims"); lab.append(h("span", "tag", S.claimsSource === "model" ? "model-reported" : S.claimsSource || (live() ? "model-reported" : "scripted"))); sec.append(lab);
  claims.forEach((c, i) => {
    const cites = c.cites || [], final = i === claims.length - 1;
    const el = part("div", `node claim ${cites.length ? "" : "unsup"} ${final ? "final" : ""}`, null,
      { keys: [`claim:${n}:${c.id}`, ...cites.map((x) => citeKey(n, x)), final ? `dec:${n}` : null], id: `s-${n}-c-${c.id}`, step: n });

    const kids = h("div", "kids");

    }

    if (final) kids.append(part("div", "cite", "decision", { keys: [`dec:${n}`], step: n, to: st.seq ? `r-${S.rec.get(st.seq)?.rid}` : null }));

}
const SPAN_KEYS = { turn: (n) => [`step:${n}`], "llm.request": (n) => [`mi:${n}`, "llmreq"], "llm.response": (n) => [`think:${n}`],
  "tool.dispatch": (n) => [`tool:${n}`], "tool.exec": (n) => [`tool:${n}`], "downstream.call": () => [], "tool.result": (n) => [`toolres:${n}`], decision: (n) => [`dec:${n}`] };

// ── failure stories ──
function story(d) {
  const id = d.failure_id || `${d.kind}-${d.span_id || d.step}`;
  let st = S.stories.get(id);
  if (!st) {
    const el = enter(part("div", "story", null, { keys: [`fail:${id}`, `failk:${d.kind}`, d.span_id ? `span:${d.span_id}` : null], id: `f-${id}`, step: d.step ?? undefined, to: d.span_id ? `sp-${d.span_id}` : null }));
    const hd = h("div", "sh"); const stt = h("span", "st");
    hd.append(h("b", null, d.kind), stt); el.prepend(hd); el.append(h("ol"));
    const inModel = d.step != null && (d.kind === "llm_timeout" || d.kind === "tool_error");
    if (inModel) ensureStep(d.step, d.t_us).mFail.append(el); else { clearEmpty(cols.am); cols.am.append(el); }
    st = { id, el, stt, kind: d.kind, step: d.step, state: "recovering", stages: [] };
    S.stories.set(id, st);
  }
  if (d.span_id) { addKey(st.el, `span:${d.span_id}`); const sp = S.steps.get(d.step); if (sp) { sp.failBySpan.set(d.span_id, id); if (sp.spans.size) renderStack(sp); } }
  const state = d.state || (d.recovered ? "recovered" : "recovering");
  st.state = state; st.el.dataset.state = state; st.stt.textContent = state;
  const text = d.stage || `attempt ${d.attempt ?? 1}${d.recovered ? " · recovered" : ""}`;
  st.stages.push(text);
  st.el.querySelector("ol").append(enter(h("li", null, text)));
  for (const r of S.rec.values()) if (r.errKind === d.kind) markErr(r);
  if (d.kind === "authority_down") $("#tk-q").classList.toggle("warn", state === "recovering");
  const isReq = d.kind === "authority_down" && /unreachable/.test(text);
  term(isReq ? `curl -s -X POST ${AUTH}/authority/v1/batches` : `filet trace --kind ${d.kind}`, isReq ? `503 {"error":"authority unavailable"}` : text,
    [`fail:${id}`, d.span_id ? `span:${d.span_id}` : null], state === "recovered" ? "ok" : state === "failed" ? "bad" : "warn", isReq ? S.curId : null);
}

// ── receipts: one JSON block each, fields one per line, nested objects indented ──
const q = (v) => `"${v}"`;

  const close = h("div", "jl"); close.style.paddingLeft = l.style.paddingLeft; close.append(h("span", "pn", last ? "}" : "},"));

}

}

  setJ(blk.L.decision, [V(q(dr.decision), [`dec:${n}`], "", { step: n, to: lastClaim ? `s-${n}-c-${lastClaim}` : `s-${n}` })]);
  if (dr.rule_id) setJ(blk.L.rule, [V(q(dr.rule_id), [`rule:${dr.rule_id}`], "", { step: n, to: `rule-${dr.rule_id}` })]); else blk.L.rule.remove();
  if (Array.isArray(dr.evidence) && dr.evidence.length) {

hg.addEventListener("keydown", (e) => { if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); setTH(TH + (e.key === "ArrowUp" ? 24 : -24)); } });

// ── sources: recorded (default), saved, live API ──
function endLive() {
  setLiveStored(null); $("#run").disabled = false;
  if (!LV.id) return;
  try { fetch(`${window.FILET_API}/call/${LV.id}/end`, { method: "POST", keepalive: true }); } catch {}
  LV.es?.close(); LV.es = null; LV.id = null; setResponding(false); $("#apilink").href = "api.html"; $("#endcall").hidden = true;
}
async function playRecorded(fail, startAt) {
  endLive();
  try { await loadBundle(); } catch { $("#err").hidden = false; $("#err").textContent = "recording unavailable"; return; }
  const run = BUNDLE.runs[fail] ?? BUNDLE.runs[""];
  runSel.value = BUNDLE.runs[fail] ? fail : "";
  const want = location.hash.startsWith("#r-") ? location.hash.slice(3) : null;
  const at = want ? run.findIndex((e) => e.event === "anchored" && e.data.receipt_id === want) : -1;
  const sAt = want ? run.findIndex((e) => e.event === "signed" && e.data.receipt_id === want) : -1;
  if (want && (at >= 0 || sAt >= 0)) { loadEvents({ kind: "recorded", fail: runSel.value }, run, "recorded", (at >= 0 ? at : sAt) + 1, false); requestAnimationFrame(() => goTo(`r-${want}`)); return; }
  loadEvents({ kind: "recorded", fail: runSel.value }, run, "recorded", startAt, true);
}
const savedCalls = () => store.get("calls", []);
function drawSaved() {
  const box = $("#saved"); box.replaceChildren();
  const list = savedCalls();
  if (!list.length) { box.append(h("span", "t", "none")); return; }
  for (const c of list) {
    const b = h("button", null, `${c.at.slice(5, 16).replace("T", " ")} · ${c.turns} turns`); b.type = "button";
    b.addEventListener("click", () => { loadEvents({ kind: "saved", id: c.id }, c.ev, "recorded", 0, true); $("#more").open = false; });
    box.append(b);
  }
}
const LV = { id: null, es: null };
function setupSay() { $("#say-in").placeholder = "Speak as the caller…"; }
const sayIn = $("#say-in"), sayGo = $("#say-go");
function growSay() { sayIn.style.height = "auto"; const lh = parseFloat(getComputedStyle(sayIn).lineHeight) || 22; sayIn.style.height = `${Math.min(Math.max(sayIn.scrollHeight, lh * 2), lh * 8)}px`; }
sayIn.addEventListener("input", () => { growSay(); $("#say-note").hidden = true; syncSend(); });
function noteLive() { const nt = $("#say-note"); nt.textContent = "connect live to reply"; nt.hidden = false; }
sayIn.addEventListener("focus", () => { if (P.playing) setPlaying(false); }); // focusing interrupts the replay at the current step
sayIn.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#say").requestSubmit(); } });
function setResponding(on) { LV.responding = on; syncSend(); }
function syncSend() { const stop = LV.responding && !sayIn.value.trim(); sayGo.dataset.stop = stop ? "1" : ""; sayGo.textContent = stop ? "■" : "↑"; sayGo.setAttribute("aria-label", stop ? "Stop" : "Send"); }
async function interrupt() {
  if (!LV.id || !window.FILET_API) return;
  try { await fetch(`${window.FILET_API}/call/${LV.id}/interrupt`, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }); } catch {}
  setResponding(false);
}
function setLiveStored(v) { store.set("liveCall", v); window.__filetLive = !!v; }
let liveSaveT = 0;
function openLive(id, api, startedAt) {
  LV.id = id; LV.api = api; LV.ending = false;
  setLiveStored({ id, api, startedAt: startedAt || new Date().toISOString(), lastEventId: 0 });
  $("#apilink").href = `api.html?call=${encodeURIComponent(id)}`;
  const pk = $("#pkglink"); pk.href = `package.html?call=${encodeURIComponent(id)}`; pk.hidden = false;
  $("#endcall").hidden = false; $("#endcall").disabled = false; $("#run").disabled = true;
  loadEvents({ kind: "live", id, api }, [], "live", 0, true);
  const seen = new Set();
  LV.es?.close();
  LV.es = new EventSource(`${api}/call/${encodeURIComponent(id)}/events?last_event_id=0`); // the server replays the whole call, then continues live
  for (const name of [...EVENTS, "error"]) LV.es.addEventListener(name, (e) => {
    if (name === "error") { if (e.data) { $("#err").hidden = false; try { $("#err").textContent = JSON.parse(e.data).message; } catch {} } return; }
    if (e.lastEventId && seen.has(e.lastEventId)) return; seen.add(e.lastEventId);
    let data; try { data = JSON.parse(e.data); } catch { return; }
    const eid = Number(e.lastEventId) || P.ev.length + 1;
    ingest({ id: eid, event: name, data });
    if (!P.playing && P.pos >= P.ev.length - 1) setPlaying(true);
    const lc = store.get("liveCall", null);
    if (lc && lc.id === id) { lc.lastEventId = Math.max(lc.lastEventId || 0, eid); clearTimeout(liveSaveT); liveSaveT = setTimeout(() => store.get("liveCall", null)?.id === id && store.set("liveCall", lc), 300); }
    if (name === "turn" && data.who === "caller") LV.sawCaller = true;
    if (name === "turn" && data.who === "agent" && LV.sawCaller) { LV.sawCaller = false; setResponding(false); }
    if (name === "done") { setResponding(false); finishLive(); }
  });
}
async function sendCaller(text) {
  const api = window.FILET_API;
  try {
    if (!LV.id && LV.creating) await LV.creating; // two quick lines never create two calls
    if (!LV.id) {
      LV.creating = (async () => {
        const r = await fetch(`${api}/call`, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
        if (!r.ok) throw new Error(`call ${r.status}`);
        return (await r.json()).id;
      })();
      let id; try { id = await LV.creating; } finally { LV.creating = null; }
      openLive(id, api);
    }
    setResponding(true);
    const r = await fetch(`${LV.api || api}/call/${LV.id}/turn`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
    if (r.status === 409) { const nt = $("#say-note"); nt.textContent = "agent is answering"; nt.hidden = false; sayIn.value = text; growSay(); return; }
    if (!r.ok) throw new Error(`turn ${r.status}`);
  } catch (err) { $("#err").hidden = false; $("#err").textContent = String(err.message || err); }
}
function finishLive() {
  LV.es?.close(); LV.es = null; P.open = false; $("#endcall").hidden = true;
  if (LV.ending) { setLiveStored(null); $("#run").disabled = false; } // only End call / New call clear the stored call
  const calls = savedCalls().filter((c) => c.id !== LV.id);
  calls.unshift({ id: LV.id, at: new Date().toISOString(), turns: P.ev.filter((e) => e.event === "turn" && e.data.who === "caller").length, ev: P.ev });
  while (calls.length && !store.set("calls", calls.slice(0, 3))) calls.pop();
  store.set("livecur", P.ev);
  if (LV.ending) LV.id = null;
  drawSaved();
}
$("#say").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = sayIn.value.trim();
  if (!t) { if (LV.responding) interrupt(); return; } // a typed line barges in; ■ only stops
  if (P.playing) setPlaying(false);
  if (!window.FILET_API) { noteLive(); return; }
  sayIn.value = ""; growSay(); sendCaller(t);
});
$("#more").addEventListener("toggle", drawSaved);
$("#newcall").addEventListener("click", () => { endLive(); $("#more").open = false; playRecorded("", 0); });
$("#endcall").addEventListener("click", async () => {
  if (!LV.id || !window.FILET_API) return;
  const b = $("#endcall"); b.disabled = true; b.textContent = "Ending…"; LV.ending = true;
  try { await fetch(`${window.FILET_API}/call/${LV.id}/end`, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }); }
  catch (err) { $("#err").hidden = false; $("#err").textContent = String(err.message || err); b.disabled = false; }
  b.textContent = "End call"; // stream stays open for reconciled, close receipt and done
});

// boot: auto-play the recorded call, resuming the last position
window.__filetBusy = false; window.__filetLive = !!store.get("liveCall", null);
S = fresh("recorded");
setupSay();
requestAnimationFrame((t) => { P.last = t; frame(t); });
{
  const saved = store.get("pos", null), src = store.get("src", null);
  const same = (a, b) => a && b && a.kind === b.kind && (a.fail || "") === (b.fail || "") && a.id === b.id;
  const lc = store.get("liveCall", null);
  if (lc?.id && (lc.api || window.FILET_API)) openLive(lc.id, lc.api || window.FILET_API, lc.startedAt);
  else if (src?.kind === "saved") { const c = savedCalls().find((x) => x.id === src.id); if (c) loadEvents(src, c.ev, "recorded", same(saved?.src, src) ? saved.pos : 0, true); else playRecorded("", 0); }
  else { const fail = src?.kind === "recorded" ? src.fail || "" : ""; const at = same(saved?.src, { kind: "recorded", fail }) ? saved.pos : 0; playRecorded(fail, at); }
}
