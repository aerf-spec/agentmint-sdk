<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Member Line Call</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231a1a1a%22/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fffdf8; --fg: #1a1a1a; --mute: #555; --line: #ddd6c8; --card: #fff; --hl: #f3ecdc;
  --ok: #1d6b2f; --bad: #a3221b; --warn: #7a5200;
  --serif: Georgia, "Times New Roman", serif;
  --mono: Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161513; --fg: #f2efe8; --mute: #b5b0a5; --line: #3a3731; --card: #1f1e1b; --hl: #2a2822; --ok: #7fd18f; --bad: #ff8a80; --warn: #e8c170; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #161513; --fg: #f2efe8; --mute: #b5b0a5; --line: #3a3731; --card: #1f1e1b; --hl: #2a2822; --ok: #7fd18f; --bad: #ff8a80; --warn: #e8c170; color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 21px/1.6 var(--serif); overflow-wrap: anywhere; }
a { color: inherit; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
[hidden] { display: none !important; }
p { margin: 8px 0; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .wait, .warn { color: var(--warn); }
.mute { color: var(--mute); }

.page { max-width: 820px; margin: 0 auto; padding: 0 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* header */
.top { padding: 28px 0 16px; border-bottom: 1px solid var(--line); }
.title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
h1 { font-size: 32px; line-height: 1.2; margin: 0; }
.mode { font-size: 19px; color: var(--mute); }
.cost { font-size: 19px; color: var(--mute); margin-left: auto; }
.sum { font-size: 20px; margin: 12px 0 0; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; }
.ctl .grp { display: contents; }
.btn { display: inline-block; font-size: 19px; line-height: 1.3; padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--fg); }
.btn.main { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn:disabled { opacity: 0.6; cursor: default; }
label.pick { display: inline-flex; align-items: center; gap: 8px; font-size: 19px; }
select { font-size: 19px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); max-width: 100%; }
.more { position: relative; }
.more > summary { list-style: none; }
.more > summary::-webkit-details-marker { display: none; }
.menu { position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: min(420px, calc(100vw - 32px)); max-height: 60vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.saved button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; font-size: 19px; }
.saved button:hover, .saved button.cur { background: var(--hl); }
.saved .when { display: block; font-size: 17px; color: var(--mute); }
.err { color: var(--bad); font-size: 19px; }

/* the call */
main { padding: 8px 0 24px; min-height: 40vh; }
.empty { color: var(--mute); padding: 24px 0; }
.grp-sec { border-bottom: 1px solid var(--line); padding: 12px 0 16px; }
.grp-sec:last-child { border-bottom: 0; }
.ln { margin: 14px 0; }
.ln .who { display: block; font-size: 18px; color: var(--mute); }
.ln .who b { color: var(--fg); }
.ln.caller p { font-style: italic; }
.ln p { margin: 2px 0 0; }
.ln .src { font-size: 18px; color: var(--warn); }
.think { margin: 10px 0; }
.think > summary, .rc details > summary { cursor: pointer; font-size: 19px; color: var(--mute); }
.think > summary:hover, .rc details > summary:hover { color: var(--fg); }
.think p, .quote { background: var(--hl); padding: 12px 16px; border-radius: 6px; white-space: pre-wrap; }
.uses { list-style: none; padding: 0; margin: 10px 0; font-size: 19px; color: var(--mute); }
.uses li::before { content: "→ "; }
.note { margin: 12px 0; padding: 10px 16px; border: 1px solid var(--line); border-left: 6px solid var(--warn); border-radius: 6px; background: var(--card); }
.note.ok { border-left-color: var(--ok); color: var(--fg); }
.note.bad { border-left-color: var(--bad); color: var(--fg); }

/* receipts */
.rc { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--fg); border-radius: 8px; padding: 18px 22px; margin: 16px 0; scroll-margin: 24px; }
.rc .kick { font-size: 18px; color: var(--mute); margin: 0; }
.rc h3 { font-size: 24px; line-height: 1.3; margin: 2px 0 10px; }
.rc .q { font-style: italic; }
.rc ol { padding-left: 28px; margin: 6px 0; }
.rc ol > li { margin: 10px 0; }
.ev { list-style: none; padding: 0; margin: 4px 0 0; }
.ev li { color: var(--mute); padding-left: 14px; border-left: 3px solid var(--line); margin-top: 4px; }
.ev li.bad { color: var(--bad); }
.maps { margin: 4px 0 8px; padding-left: 28px; }
.caveat { padding: 8px 14px; background: var(--hl); border-radius: 6px; }
.st { font-weight: bold; margin: 14px 0 4px; }
.st span + span::before { content: " · "; color: var(--mute); font-weight: normal; }
.rc details { margin-top: 8px; }
pre.raw { font: 17px/1.5 var(--mono); background: var(--hl); padding: 12px 14px; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; max-height: 70vh; overflow-y: auto; }
.mono { font-family: var(--mono); font-size: 17px; }
/* minor receipts: one line until opened */
.rc.minor { border-left-width: 1px; padding: 0; margin: 8px 0; }
.rc.minor > summary { list-style: none; cursor: pointer; padding: 10px 16px; font-size: 19px; display: flex; gap: 12px; align-items: baseline; color: var(--fg); }
.rc.minor > summary::-webkit-details-marker { display: none; }
.rc.minor > summary::before { content: "▸"; color: var(--mute); }
.rc.minor[open] > summary::before { content: "▾"; }
.rc.minor > summary .t { flex: 1; }
.rc.minor > .in { padding: 0 22px 16px; border-top: 1px solid var(--line); }
.ckb { margin-top: 8px; }

/* bottom bar */
.bottom { position: sticky; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 0 max(12px, env(safe-area-inset-bottom)); }
.say { display: flex; gap: 10px; align-items: flex-end; }
.say textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 10px 14px; font-size: 21px; line-height: 1.5; height: 3.3em; max-height: 9em; }
.say textarea:focus { border-color: var(--fg); outline: none; }
.say-msg { font-size: 18px; margin: 6px 0 0; }
.ro { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.latest { position: fixed; left: 50%; transform: translateX(-50%); bottom: 110px; z-index: 11; }

footer { padding: 24px 0 48px; color: var(--mute); font-size: 18px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
footer details { flex-basis: 100%; }
footer summary { cursor: pointer; }
footer .row { display: flex; gap: 8px; margin-top: 8px; }
footer input { flex: 1; min-width: 0; font-size: 18px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }

@media (max-width: 600px) {
  body { font-size: 20px; }
  h1 { font-size: 28px; }
  .rc { padding: 14px 16px; }
  .rc.minor > .in { padding: 0 16px 14px; }
  .cost { margin-left: 0; }
  .latest { bottom: 120px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="title">
      <h1>Member line call</h1>
      <span class="mode" id="mode"></span>
      <a class="cost" id="cost" href="costs.html" target="_blank" rel="noopener" hidden></a>
    </div>
    <p class="sum" id="sum"></p>
    <div class="ctl">
      <span class="grp rec-only">
        <button class="btn" id="play" type="button">Pause</button>
        <button class="btn" id="restart" type="button">Restart</button>
        <button class="btn" id="all" type="button">Show all</button>
        <label class="pick">Recording
          <select id="run">
            <option value="">Normal call</option>
            <option value="llm_timeout">Model times out</option>
            <option value="tool_error">Lookup fails</option>
            <option value="authority_down">Public log offline</option>
            <option value="signer_crash">Signing service restarts</option>
          </select>
        </label>
      </span>
      <button class="btn" id="endcall" type="button" hidden>End call</button>
      <a class="btn" id="pkglink" href="package.html" target="_blank" rel="noopener" hidden>Evidence package</a>
      <button class="btn main" id="newsess" type="button">Start a live call</button>
      <details class="more" id="more"><summary class="btn">Past calls</summary><div class="menu"><div class="saved" id="saved"></div></div></details>
    </div>
    <p class="err" id="err" role="status" hidden></p>
  </header>

  <main id="feed"></main>

  <div class="bottom" id="bottom">
    <form class="say" id="say" autocomplete="off">
      <textarea id="say-in" rows="2" placeholder="Type what the caller says" aria-label="What the caller says"></textarea>
      <button class="btn main" id="say-go" type="submit">Send</button>
    </form>
    <p class="say-msg warn" id="say-note" hidden></p>
    <p class="say-msg mute" id="say-count" hidden></p>
    <div class="ro" id="say-ro" hidden><span id="ro-text">This is a recorded call.</span><button class="btn main" id="ro-new" type="button">Start a live call</button></div>
  </div>

  <footer>
    <a href="api.html" id="apilink" target="_blank" rel="noopener">Network log</a>
    <a href="costs.html" target="_blank" rel="noopener">Costs</a>
    <details><summary>Backend</summary><div class="row"><input id="api" type="url" placeholder="https://…" spellcheck="false" aria-label="Backend URL"><button class="btn" id="api-save" type="button">Save</button></div></details>
  </footer>
</div>
<button class="btn latest" id="latest" type="button" hidden>Jump to latest ↓</button>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const EVENTS = ["start", "turn", "model_input", "thinking", "span", "loop", "tool_call", "tool_result", "failure", "decision", "signed",
  "queued", "batch", "consistency", "anchored", "verified", "gap", "reconciled", "done", "cost", "call_cost", "interrupted", "api"];

// ── browser storage ──
const store = {
  get(k, d) { try { const v = localStorage.getItem(`filet.v3.${k}`); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(`filet.v3.${k}`); else localStorage.setItem(`filet.v3.${k}`, JSON.stringify(v)); return true; } catch { return false; } },
};
const qs = new URLSearchParams(location.search);
if (qs.has("api")) { const a = qs.get("api"); store.set("api", a ? a.replace(/\/+$/, "") : null); }
if (qs.has("presenter")) { const t = qs.get("presenter"); store.set("presenter", t && t !== "off" ? t : null); }
const API_DEFAULT = "https://filet-call.anikethsubs.workers.dev";
{ const a = store.get("api", null); window.FILET_API = a === "off" ? null : a || window.FILET_API || API_DEFAULT; }
const PRESENTER = store.get("presenter", null);

// ── plain words ──
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const words = (x) => String(x ?? "").replace(/^(decide|disclose|error):/, "").replace(/[_-]+/g, " ").trim();
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
const clip = (v, n = 180) => { const s = typeof v === "string" ? v : JSON.stringify(v); return s.length > n ? `${s.slice(0, n - 1)}…` : s; };
const withheld = (t) => (t && typeof t === "object" && "withheld" in t ? "(withheld by the safety scan)" : t);
const live = () => S.mode === "live";
const DECISION = {
  ai_and_recording_disclosed: "Told the caller it is an AI and the call is recorded",
  authorized_rep_found_pending_dob: "Caller is on file as a representative; date of birth still to check",
  rep_verified: "Caller verified",
  rep_not_verified: "Caller not verified",
  member_not_found: "Member not found",
  member_verified: "Member verified",
  remaining_visits_stated: "Remaining visits given",
  remaining_visits_flagged: "Remaining visits given, with a pending claim flagged",
  in_network_cost_stated: "In-network cost given",
  out_of_network_costs_stated: "Out-of-network and in-network costs given",
  declined_provider_must_request_pa: "Declined: the provider must request prior authorization",
  pa_letter_sent: "Prior authorization letter sent",
  declined_out_of_scope: "Declined: outside what the agent can do",
  sms_consent_recorded: "Consent to text recorded",
  sms_declined: "Caller declined texts",
  escalated_to_human: "Passed to a person",
  info_provided: "Information given",
  call_closed: "Call closed",
};
const CAVEAT = { pending_claims: "A claim is still being processed, so this number may change.", out_of_scope: "This is outside what the agent is allowed to do.", not_verified: "The caller is not verified yet.", claims_lag: "A claim is still being processed, so this number may change.", estimate: "This is an estimate." };
const TOOL_DID = { check_authorized_rep: "Checked the list of authorized representatives", verify_rep_dob: "Checked the caller's date of birth", lookup_benefits: "Looked up the plan's benefits",
  check_network: "Checked whether the provider is in network", check_prior_auth: "Checked prior authorization rules", send_pa_letter: "Sent the prior authorization letter",
  find_providers: "Searched for in-network providers", estimate_cost: "Estimated the cost", check_coverage_requirements: "Checked coverage requirements" };
const TOOL_ASK = { check_authorized_rep: "check the authorized representatives", verify_rep_dob: "check the date of birth", lookup_benefits: "look up benefits", check_network: "check the provider network",
  check_prior_auth: "check prior authorization rules", send_pa_letter: "send the prior authorization letter", record_decision: "record a decision" };
const ERR = { llm_timeout: "The model did not answer in time", llm_error: "The model returned an error", tool_error: "A member-system lookup failed", authority_down: "The public log could not be reached",
  signer_crash: "The signing service stopped", refusal: "The model refused to answer", leak_blocked: "Text was held back by the safety scan", loop_limit: "The model took too many steps",
  agent_error: "The agent hit an error", boot_error: "The call failed to start" };
const STAGE = { detected: "Detected", retrying: "Retrying", queued: "Receipts held until the log is back", restarted: "Restarted", recovered: "Recovered", unrecoverable: "Could not recover" };
const COUNT = { turns: "Turns", model_iterations: "Model steps", llm_requests: "Model requests", decisions: "Decisions", errors: "Problems", failures: "Problems", receipts: "Receipts",
  tool_calls: "Lookups", observed_responses: "Model responses seen", matched: "Matched to receipts" };
const decisionText = (d) => DECISION[d] || cap(words(d));
const toolDid = (n) => TOOL_DID[n] || cap(words(n));
const toolAsk = (n) => TOOL_ASK[n] || words(n);

// ── view state ──
let S;
const feed = $("#feed");
function fresh(mode) {
  return { mode, instant: false, rules: {}, model: null, groups: [], cur: null, byTurn: new Map(), stepGroup: new Map(), turns: new Map(), think: new Map(),
    rec: new Map(), rid: new Map(), nDec: 0, nCaller: 0, stories: new Map(), usd: 0, tok: 0, costFinal: false, reconciled: null, done: null, consistencyBad: false, closeG: null, curId: 0 };
}
function resetView(mode) {
  S = fresh(mode);
  feed.replaceChildren(h("p", "empty", mode === "live" ? "Connecting to the call…" : "Loading the recorded call…"));
  $("#cost").hidden = true;
  $("#mode").textContent = mode === "live" ? "Live call" : "Recorded call";
  document.querySelectorAll(".rec-only").forEach((e) => { e.hidden = mode === "live"; });
  $("#err").hidden = true;
  updateSummary();
}
function clearEmpty() { feed.querySelector(":scope > .empty")?.remove(); }

// a group = one caller line and everything the agent did about it
function newGroup(turn) {
  clearEmpty();
  const el = h("section", "grp-sec");
  const g = { el, turn, callerText: null, caller: h("div"), notes: h("div"), decs: h("div"), reply: h("div"), minor: h("div"), uses: h("ul", "uses"), results: [], pending: [], replied: false, userSet: false, thinkText: "" };
  g.work = h("details", "think"); g.work.hidden = true;
  const sm = h("summary", null, "Model's thinking"); sm.addEventListener("click", () => { g.userSet = true; });
  g.workBody = h("p"); g.work.append(sm, g.workBody);
  g.uses.hidden = true;
  el.append(g.caller, g.work, g.uses, g.notes, g.decs, g.reply, g.minor);
  if (S.closeG) feed.insertBefore(el, S.closeG.el); else feed.append(el);
  S.groups.push(g); S.cur = g;
  if (turn != null) S.byTurn.set(turn, g);
  return g;
}
function groupFor(d) {
  if (live() && typeof d.turn === "number" && S.byTurn.has(d.turn)) return S.byTurn.get(d.turn);
  if (!live() && d.step != null && S.stepGroup.has(d.step)) return S.stepGroup.get(d.step);
  return S.cur || newGroup(live() && typeof d.turn === "number" ? d.turn : null);
}
function closeGroup() {
  if (S.closeG) return S.closeG;
  const g = newGroup(null); S.closeG = g; S.cur = S.groups.at(-2) || g;
  return g;
}
const itKey = (d) => (live() ? `${d.turn}:${d.iteration ?? 1}` : `s${d.step}`);
function speech(who, at, text, src) {
  const e = h("div", `ln ${who}`);
  const w = h("span", "who"); w.append(h("b", null, who === "caller" ? "Caller" : "Ava (AI agent)"), at ? ` · ${at}` : "");
  e.append(w, h("p", null, text));
  if (src) e.append(h("span", "src", src === "no_reply" ? "No reply from the model; standard line used." : "Standard line used after a model problem."));
  return e;
}

// ── receipts ──
function makeCard(g, kind, where) {
  const minor = kind !== "decide" && kind !== "close";
  const c = { g, kind, minor, rec: null, dec: null, n: 0 };
  if (minor) {
    c.el = h("details", "rc minor"); c.sumT = h("span", "t"); c.sumMark = h("span"); const s = h("summary"); s.append(c.sumT, c.sumMark); c.inner = h("div", "in"); c.el.append(s, c.inner);
  } else { c.el = h("article", "rc"); c.inner = c.el; }
  c.kick = h("p", "kick"); c.title = h("h3"); c.body = h("div"); c.st = h("p", "st"); c.st.append(h("span", "wait", "… Being signed"));
  c.raw = h("details"); const rs = h("summary", null, "Show raw receipt"); c.pre = h("pre", "raw"); c.raw.append(rs, c.pre); c.raw.hidden = true;
  c.raw.addEventListener("toggle", () => { rs.textContent = c.raw.open ? "Hide raw receipt" : "Show raw receipt"; if (c.raw.open) fillRaw(c); });
  if (minor) c.inner.append(c.body, c.st, c.raw); else c.inner.append(c.kick, c.title, c.body, c.st, c.raw);
  (where || (kind === "decide" || kind === "close" ? g.decs : kind === "err" ? g.notes : g.minor)).append(c.el);
  return c;
}
function fillRaw(c) {
  const rec = c.rec; if (!rec) return;
  const r = { ...rec.r };
  if (rec.anch?.log_inclusion_proof) r.log_inclusion_proof = rec.anch.log_inclusion_proof;
  c.pre.textContent = JSON.stringify(r, null, 2);
}
// one line per receipt: signed, in the public log, chain intact
function statusParts(rec) {
  if (!rec) return [["wait", "… Being signed"]];
  const v = rec.ver, out = [];
  out.push(v && v.issuer === false ? ["bad", "✗ Signature did not verify"] : ["ok", "✓ Signed"]);
  if (v && v.log && v.log !== "passed") out.push(["bad", "✗ Not in public log"]);
  else if ((v && v.log === "passed") || rec.anch) out.push(["ok", "✓ In public log"]);
  else out.push(["wait", "… Waiting for public log"]);
  const link = chainLink(rec);
  if ((v && v.chain_ok === false) || link === false) out.push(["bad", link === false ? "✗ Chain broken: previous receipt does not match" : "✗ Chain broken"]);
  else if ((v && v.chain_ok) || link === true) out.push(["ok", "✓ Chain intact"]);
  else out.push(["wait", "… Checking chain"]);
  return out;
}
function chainLink(rec) {
  const prev = rec.d.previous_receipt_hash ?? rec.r.previous_receipt_hash ?? null;
  if (rec.seq === 1) return prev == null;
  const p = S.rec.get(rec.seq - 1); if (!p) return null;
  return prev === p.d.receipt_hash;
}
function renderStatus(c) {
  const parts = statusParts(c.rec);
  c.st.replaceChildren(...parts.map(([cls, t]) => h("span", cls, t)));
  if (c.minor) { const bad = parts.some((p) => p[0] === "bad"), wait = parts.some((p) => p[0] === "wait"); c.sumMark.className = bad ? "bad" : wait ? "wait" : "ok"; c.sumMark.textContent = bad ? "✗" : wait ? "…" : "✓"; c.sumMark.title = parts.map((p) => p[1]).join(" · "); }
  c.raw.hidden = !c.rec;
  if (c.raw.open) fillRaw(c);
}
function para(label, text, cls) { const p = h("p", cls); if (label) { p.append(h("b", null, label), " "); } p.append(text ?? ""); return p; }
function turnText(ref) { const t = S.turns.get(`caller:${ref}`) || S.turns.get(`agent:${ref}`); return t ? `${t.who === "caller" ? "Caller" : "Ava"} (${t.at}): ${t.text}` : null; }
// a cite's value: from the receipt (live) or from what the page saw (recorded)
function citeValue(c, g) {
  if (c.value !== undefined) return c.value;
  if (c.kind === "rule") return S.rules[c.ref];

  for (const c of serverCalls) {
    const cur = m.get(c.id) || { id: c.id, title: "", startedAt: c.started_at, lastEventId: 0 };
    cur.ended = !!(cur.endedAt || c.ended); cur.turns = c.turns; m.set(c.id, cur);
  }
  for (const s of m.values()) s.ended = s.ended || !!s.endedAt;
  return [...m.values()].sort((a, b) => String(b.startedAt).localeCompare(String(a.startedAt)));
}
const fmtWhen = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
async function drawSaved() {
  const box = $("#saved");
  if (!box.childElementCount) box.append(h("p", "mute", "Loading…"));
  await fetchServerCalls();
  box.replaceChildren();
  const rec = h("button", LV.id ? null : "cur", "Recorded call"); rec.type = "button";
  rec.addEventListener("click", () => { $("#more").open = false; playRecorded(runSel.value, 0); });
  box.append(rec);
  const list = mergedSessions();
  if (!list.length) { box.append(h("p", "mute", "No live calls yet.")); return; }
  for (const s of list) {
    const b = h("button", s.id === LV.id ? "cur" : null); b.type = "button";
    b.append(s.title ? `“${s.title}”` : "Live call", h("span", "when", `${fmtWhen(s.startedAt)}${s.ended ? " · ended" : ""}`));
    b.addEventListener("click", () => { $("#more").open = false; openSession(s.id); });
    box.append(b);
  }
}

// one live call: replay everything, then continue live
let liveSaveT = 0;
function openSession(id, api = window.FILET_API) {
  if (!api || !id) return;
  closeStream(); saveDraftNow();
  LV.id = id; LV.api = api; LV.ended = false; LV.sawCaller = false; setResponding(false);
  const s = upsertSession(id, {});
  setLiveStored({ id, api, startedAt: s.startedAt, lastEventId: s.lastEventId || 0 });
  setUrl(id);
  $("#apilink").href = `api.html?call=${encodeURIComponent(id)}`;
  const pk = $("#pkglink"); pk.href = `package.html?call=${encodeURIComponent(id)}`; pk.hidden = false;
  const eb = $("#endcall"); eb.hidden = false; eb.disabled = false; eb.textContent = "End call";
  follow = true;
  loadEvents({ kind: "live", id, api }, [], "live", 0, true);
  composerMode(); restoreDraft();
  const seen = new Set();
  const es = new EventSource(`${api}/call/${encodeURIComponent(id)}/events?last_event_id=0`);
  LV.es = es;
  let got = 0;
  es.addEventListener("error", (e) => {
    if (e.data) { $("#err").hidden = false; try { $("#err").textContent = JSON.parse(e.data).message; } catch {} return; }
    if (!got && es.readyState === EventSource.CLOSED && LV.es === es) { $("#err").hidden = false; $("#err").textContent = "This call could not be opened."; setLiveStored(null); }
  });
  for (const name of EVENTS) es.addEventListener(name, (e) => {
    if (LV.es !== es) return;
    if (e.lastEventId && seen.has(e.lastEventId)) return; seen.add(e.lastEventId);
    let data; try { data = JSON.parse(e.data); } catch { return; }
    got++;
    const eid = Number(e.lastEventId) || P.ev.length + 1;
    ingest({ id: eid, event: name, data });
    if (!P.playing && P.pos >= P.ev.length - 1) setPlaying(true);
    clearTimeout(liveSaveT);
    liveSaveT = setTimeout(() => { if (LV.id !== id) return; upsertSession(id, { lastEventId: eid }); const lc = store.get("liveCall", null); if (lc?.id === id) store.set("liveCall", { ...lc, lastEventId: eid }); }, 400);
    if (name === "turn" && data.who === "caller") {
      LV.sawCaller = true;
      if (!sessions().find((x) => x.id === id)?.title) upsertSession(id, { title: String(data.text || "").trim().replace(/\s+/g, " ").slice(0, 40) });
    }
    if (name === "turn" && data.who === "agent" && LV.sawCaller) { LV.sawCaller = false; setResponding(false); }
    if (name === "done") { setResponding(false); finishLive(id); }
  });
}
function finishLive(id) {
  closeStream(); P.open = false; $("#endcall").hidden = true;
  LV.ended = true;
  upsertSession(id, { endedAt: sessions().find((x) => x.id === id)?.endedAt || new Date().toISOString() });
  if (store.get("liveCall", null)?.id === id) setLiveStored(null);
  $("#mode").textContent = `Live call (ended)${S.model ? ` · model ${S.model}` : ""}`;
  composerMode();
}
async function newSession() {
  if (!window.FILET_API) { $("#err").hidden = false; $("#err").textContent = "No backend is set, so a live call cannot start."; return; }
  if (LV.creating) return LV.creating;
  const btns = [$("#newsess"), $("#ro-new")]; btns.forEach((b) => { b.disabled = true; });
  LV.creating = (async () => {
    const r = await fetch(`${window.FILET_API}/call`, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
    if (!r.ok) throw new Error(r.status === 429 ? "Too many calls started. Try again in a minute." : `The call could not start (${r.status}).`);
    return (await r.json()).id;
  })();
  try {
    const id = await LV.creating;
    upsertSession(id, { startedAt: new Date().toISOString() });
    openSession(id); sayIn.focus();
  } catch (err) { $("#err").hidden = false; $("#err").textContent = String(err.message || err); }
  finally { LV.creating = null; btns.forEach((b) => { b.disabled = false; }); }
}

// composer
const sayIn = $("#say-in"), sayGo = $("#say-go");
sayIn.maxLength = MAXLEN;
function growSay() { sayIn.style.height = "auto"; const lh = parseFloat(getComputedStyle(sayIn).lineHeight) || 30; sayIn.style.height = `${Math.min(Math.max(sayIn.scrollHeight + 2, lh * 2 + 22), lh * 6)}px`; }
function showNote(t) { const nt = $("#say-note"); nt.textContent = t; nt.hidden = false; }
function composerMode() {
  const isLive = !!LV.id, ended = isLive && LV.ended;
  $("#say").hidden = !isLive || ended;
  $("#say-ro").hidden = isLive && !ended;
  $("#ro-text").textContent = ended ? "This call has ended." : "This is a recorded call.";
  $("#ro-new").textContent = ended ? "Start a new call" : "Start a live call";
  $("#newsess").textContent = isLive ? "Start a new call" : "Start a live call";
  $("#say-note").hidden = true;
}
function syncCount() {
  const n = sayIn.value.length, c = $("#say-count");
  c.hidden = n < MAXLEN * 0.8; c.textContent = `${n.toLocaleString("en-US")} of ${MAXLEN.toLocaleString("en-US")} characters`; c.className = `say-msg ${n >= MAXLEN ? "warn" : "mute"}`;
}
const draftKey = () => `draft.${LV.id || "recorded"}`;
let draftT = 0;
function saveDraftNow() { clearTimeout(draftT); if (!LV.id) return; const v = sayIn.value; store.set(draftKey(), v ? v : null); }
function restoreDraft() { sayIn.value = store.get(draftKey(), "") || ""; growSay(); syncCount(); syncSend(); $("#say-note").hidden = true; }
sayIn.addEventListener("input", () => {
  growSay(); $("#say-note").hidden = true; syncSend(); syncCount();
  clearTimeout(draftT); const key = draftKey(); draftT = setTimeout(() => store.set(key, sayIn.value || null), 300);
});
sayIn.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#say").requestSubmit(); } });
function setResponding(on) { LV.responding = on; syncSend(); }
function syncSend() { const stop = LV.responding && !sayIn.value.trim(); sayGo.textContent = stop ? "Stop" : "Send"; sayGo.classList.toggle("main", !stop); }
async function interrupt() {
  if (!LV.id || !LV.api) return;
  try { await fetch(`${LV.api}/call/${LV.id}/interrupt`, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }); } catch {}
  setResponding(false);
}
async function sendCaller(text) {
  if (text.length > MAXLEN) { showNote("Too long: 2,000 characters at most."); return; }
  const id = LV.id;
  setResponding(true);
  let r;
  try { r = await fetch(`${LV.api}/call/${id}/turn`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) }); }
  catch { setResponding(false); showNote("Could not send. Try again."); return; }
  if (r.ok) {
    if (LV.id === id && sayIn.value.trim() === text) { sayIn.value = ""; growSay(); syncCount(); }
    store.set(`draft.${id}`, null); syncSend(); return;
  }
  setResponding(false);
  if (r.status === 413) showNote("Too long: 2,000 characters at most.");
  else if (r.status === 429) { const ra = Number(r.headers.get("retry-after")); showNote(`Too many messages. Try again in ${ra > 0 ? `${ra} seconds` : "a moment"}.`); }
  else if (r.status === 409) showNote("The call has ended or the agent is still answering.");
  else showNote("Could not send. Try again.");
}
$("#say").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = sayIn.value.trim();
  if (!t) { if (LV.responding) interrupt(); return; }
  if (!LV.id || LV.ended) { showNote("Start a live call first."); return; }
  follow = true;
  sendCaller(t);
});
$("#more").addEventListener("toggle", () => { if ($("#more").open) drawSaved(); });
$("#newsess").addEventListener("click", newSession);
$("#ro-new").addEventListener("click", newSession);
$("#endcall").addEventListener("click", async () => {
  if (!LV.id || !LV.api) return;
  const b = $("#endcall"); b.disabled = true; b.textContent = "Ending…";
  try { await fetch(`${LV.api}/call/${LV.id}/end`, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }); }
  catch (err) { $("#err").hidden = false; $("#err").textContent = String(err.message || err); b.disabled = false; b.textContent = "End call"; }
  // the stream stays open for the close receipt and done; then the call turns read-only
});
addEventListener("beforeunload", saveDraftNow);

// boot: ?s=<id> opens that call; else resume the active call; else play the recording
window.__filetBusy = false; window.__filetLive = !!store.get("liveCall", null);
S = fresh("recorded");
requestAnimationFrame((t) => { P.last = t; frame(t); });
{
  const saved = store.get("pos", null), src = store.get("src", null);
  const same = (a, b) => a && b && a.kind === b.kind && (a.fail || "") === (b.fail || "") && a.id === b.id;
  const lc = store.get("liveCall", null), sParam = qs.get("s");
  if (sParam && window.FILET_API) openSession(sParam);
  else if (lc?.id && (lc.api || window.FILET_API)) openSession(lc.id, lc.api || window.FILET_API);
  else { const fail = src?.kind === "recorded" ? src.fail || "" : ""; const at = same(saved?.src, { kind: "recorded", fail }) ? saved.pos : 0; playRecorded(fail, at); }
}
</script>
