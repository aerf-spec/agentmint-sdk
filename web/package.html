<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Package</title>
<style>
:root { --bg:#fcfcfb; --ink:#1c2530; --ink-2:#3c4654; --muted:#6b7280; --faint:#9aa1ab; --line:#e6e8eb; --code-bg:#f3f4f6; --card:#fff; --allow:#1a7350; --block:#b0392f; --warn:#8a5a00;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14171b; --ink:#e6e9ed; --ink-2:#c3c9d1; --muted:#9aa3ae; --faint:#7b838e; --line:#2b3138; --code-bg:#1d2228; --card:#181c21; --allow:#5cc597; --block:#f08a80; --warn:#e0b25c; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#14171b; --ink:#e6e9ed; --ink-2:#c3c9d1; --muted:#9aa3ae; --faint:#7b838e; --line:#2b3138; --code-bg:#1d2228; --card:#181c21; --allow:#5cc597; --block:#f08a80; --warn:#e0b25c; color-scheme: dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:20px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
a{color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
button{font:inherit;font-size:18px;font-weight:500;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--muted)}
.mono{font-family:var(--mono);font-size:16px}
.muted,.dim{color:var(--muted)}
.ok{color:var(--allow)} .bad{color:var(--block)} .warn{color:var(--warn)} .blue{color:var(--ink)}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:clamp(28px,5vw,48px) 16px 20px;border-bottom:1px solid var(--line);max-width:1300px;margin:0 auto}
header .brand{font-size:clamp(28px,4.5vw,34px);font-weight:600;letter-spacing:-0.01em;line-height:1.2}
header .brand b{font-weight:bold}
header .callid{color:var(--muted);min-width:0;font-size:16px;font-family:var(--mono)}
header .tag{color:var(--warn);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
header .sp{flex:1}
main{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:32px;padding:24px 16px;max-width:1300px;margin:0 auto}
.pane{min-width:0}
#left{display:flex;flex-direction:column}
#right{padding:0 0 48px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.label{font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
#summary{padding:0 0 16px;border-bottom:1px solid var(--line)}
.check{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:6px 0;align-items:start;font-size:19px}
.check .mk{font-weight:bold;text-align:center}
.check .why{grid-column:2;color:var(--muted);font-size:16px}
.check.fail .t{color:var(--block)}
#list{padding:8px 0}
.row{display:grid;grid-template-columns:60px 1fr 22px;gap:8px;padding:10px 12px;cursor:pointer;border:1px solid transparent;align-items:start;font-size:18px;border-radius:8px}
.row:hover{background:var(--code-bg)}
.row.sel{background:var(--card);border-color:var(--line)}
.row .tm{color:var(--faint);font-size:16px;font-family:var(--mono)}
.row .rl{color:var(--muted);font-size:16px}
.row.minor .dc{color:var(--muted)}
.row .st{text-align:right;font-weight:bold}
#trans{border-top:1px solid var(--line);padding:12px 0}
#trans summary{cursor:pointer}
.tline{display:grid;grid-template-columns:60px 1fr;gap:8px;padding:6px;border-radius:4px;font-size:19px}
.tline .at{color:var(--faint);font-size:16px;font-family:var(--mono)}
.tline .who{font-weight:bold;margin-right:6px}
.tline.hl{background:var(--code-bg);outline:1px solid var(--line)}
.sec{margin:0 0 32px}
.sec>.label{margin-bottom:8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q{color:var(--ink-2)}
.quote{color:var(--muted);margin-top:6px}
.claim{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin:0 0 12px}
.claim.flash{outline:2px solid var(--muted)}
.claim .cid{display:inline-block;min-width:30px;padding:0 6px;margin-right:10px;border:1px solid var(--line);border-radius:999px;text-align:center;font:16px/26px var(--mono);color:var(--muted)}
.claim .nocite{margin-left:10px;color:var(--warn);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cites{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.cite{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start;color:var(--muted);border-left:2px solid var(--line);padding-left:12px;font-size:18px}
.cite .k{font-size:16px;font-family:var(--mono);color:var(--faint)}
.cite .v{min-width:0}
.cite .ref{margin-right:8px;color:var(--ink)}
.cite .val{font-family:var(--mono);font-size:16px;color:var(--ink-2);background:var(--code-bg);padding:1px 6px;border-radius:4px}
.cite .unres{color:var(--block);margin-left:6px}
.cite .loc{font-size:16px;margin-left:6px;color:var(--faint)}
.decision{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 22px}
.decision .d{display:block;font-size:24px;font-weight:600;line-height:1.3;margin-bottom:6px}
.decision .r{font-weight:600;margin-right:8px}
.decision .rt{display:block;margin-top:4px}
.decision ul{margin:4px 0;padding-left:28px}
.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:4px 16px}
.kv .k{color:var(--muted)}
details.raw>summary{cursor:pointer;color:var(--muted);font-size:17px}
pre.json{background:var(--code-bg);color:var(--ink-2);border-radius:8px;padding:14px 16px;margin:8px 0 0;font:16px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:600px;overflow-y:auto}
.jk.lnk{text-decoration:underline;cursor:pointer}
.proof{display:flex;flex-direction:column;gap:10px}
.pr{display:grid;grid-template-columns:26px minmax(140px,220px) 1fr;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:19px}
.pr.flash{outline:2px solid var(--muted)}
.pr .mk{font-weight:bold;text-align:center}
.pr .dt{color:var(--muted);min-width:0;word-break:break-all;font-family:var(--mono);font-size:16px}
@media (max-width:600px){.pr{grid-template-columns:26px 1fr}.pr .dt{grid-column:1/-1}}
.path{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.path div{display:grid;grid-template-columns:52px 1fr;gap:8px}
.disc textarea,.modal textarea{width:100%;min-height:280px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:16px/1.55 var(--mono);padding:12px}
.empty{color:var(--muted);padding:40px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:24px;width:min(860px,100%);max-height:90vh;overflow:auto}
.modal .bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.drop{border:1px dashed var(--line);border-radius:6px;padding:14px;text-align:center;color:var(--muted);margin-bottom:12px}
.drop.over{border-color:var(--ink);color:var(--ink)}
#err{color:var(--block)}
.status{color:var(--muted);font-size:16px}
input[type=file]{font-size:18px;max-width:100%}
@media (max-width: 600px) { body { font-size: 19px; } }
</style>
</head>
<body>
<header>
  <span class="brand">Evidence package</span>
  <span class="callid" id="callid">loading…</span>
  <span class="tag" id="rectag" hidden>recorded</span>
  <span class="sp"></span>
  <span class="status" id="loadst"></span>
  <button id="btnLoad">Load package</button>
  <button id="btnDl">Download package</button>
</header>
<main>
  <aside class="pane" id="left">
    <section id="summary"><div class="label">Checked in this browser</div><div id="checks"><div class="check"><span class="mk dim">…</span><span class="t muted">waiting for package</span></div></div></section>
    <section id="list"></section>
    <details id="trans"><summary class="label">Transcript</summary><div id="tlines"></div></details>
  </aside>
  <section class="pane" id="right"><div class="empty">loading package…</div></section>
</main>

<div class="modal" id="mLoad"><div class="box">
  <div class="label" style="margin-bottom:12px">Load package</div>
  <div class="drop" id="drop">drop a package .json here, or paste it below</div>
  <textarea id="pasteTa" spellcheck="false" placeholder='{ "call_id": …, "receipts": [ … ] }'></textarea>
  <div class="bar"><button id="btnVerify">Verify this package</button><input type="file" id="file" accept=".json,application/json"><span class="sp"></span><span id="err"></span><button data-close>Close</button></div>
</div></div>
<div class="modal" id="mDl"><div class="box">
  <div class="label" style="margin-bottom:12px">Package JSON</div>
  <textarea id="dlTa" readonly spellcheck="false"></textarea>
  <div class="bar"><a id="dlLink" download><button>Save .json</button></a><button id="btnCopy">Copy</button><span class="sp"></span><button data-close>Close</button></div>
</div></div>

<script type="module">
// ─────────────────────────── crypto primitives (browser, WebCrypto) ───────────────────────────
// Canonical JSON byte-identical to the AgentMint SDK kernel (src/kernel/canonical.ts):
// keys sorted by code point, NFC strings, RFC 8785 escapes only, raw UTF-8 otherwise.
const enc = new TextEncoder();
function encStr(v){let o='"';for(const ch of v.normalize("NFC")){switch(ch){case'"':o+='\\"';break;case"\\":o+="\\\\";break;case"\b":o+="\\b";break;case"\f":o+="\\f";break;case"\n":o+="\\n";break;case"\r":o+="\\r";break;case"\t":o+="\\t";break;default:{const c=ch.codePointAt(0);o+=c<=0x1f?"\\u"+c.toString(16).padStart(4,"0"):ch}}}return o+'"'}
function encNum(v){if(!Number.isFinite(v))throw new TypeError("non-finite number");if(Object.is(v,-0))return"0";return String(v)}
function cmpCP(a,b){const ap=Array.from(a),bp=Array.from(b);for(let i=0;i<Math.min(ap.length,bp.length);i++){const d=ap[i].codePointAt(0)-bp[i].codePointAt(0);if(d)return d}return ap.length-bp.length}
function canon(v){
  if(v===null)return"null";if(v===true)return"true";if(v===false)return"false";
  if(typeof v==="string")return encStr(v);if(typeof v==="number")return encNum(v);
  if(Array.isArray(v))return"["+v.map(canon).join(",")+"]";
  if(typeof v==="object"){const ks=Object.keys(v).filter(k=>v[k]!==undefined).map(k=>({raw:k,n:k.normalize("NFC")}));ks.sort((a,b)=>cmpCP(a.n,b.n));return"{"+ks.map(k=>encStr(k.n)+":"+canon(v[k.raw])).join(",")+"}"}
  throw new TypeError("unsupported value");
}
const canonBytes=v=>enc.encode(canon(v));
const POST=["signature","timestamp","parent_signature","parent_key_id","log_inclusion_proof"];
function payloadBytes(r){const o={...r};for(const f of POST)delete o[f];return canonBytes(o)}
const toHex=b=>Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");
function fromHex(h){if(!/^(?:[0-9a-f]{2})*$/.test(h))throw new Error("bad hex");const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o}
const sha256=async d=>new Uint8Array(await crypto.subtle.digest("SHA-256",typeof d==="string"?enc.encode(d):d));
const sha256Hex=async d=>toHex(await sha256(d));
const sha512Hex=async d=>toHex(new Uint8Array(await crypto.subtle.digest("SHA-512",d)));
async function leafHash(data){const b=new Uint8Array(data.length+1);b.set(data,1);return sha256Hex(b)}
async function hashInternal(l,r){const b=new Uint8Array(65);b[0]=1;b.set(fromHex(l),1);b.set(fromHex(r),33);return sha256Hex(b)}
// RFC 9162 §2.1.3.2 — mirrors SDK walkAuditPath; records each step for display.
async function walkAuditPath(leaf,path,idx,size,steps){
  if(idx<0||size<1||idx>=size)return"";let fn=idx,sn=size-1,r=leaf;
  for(const p of path){if(sn===0)return"";
    if(fn%2===1||fn===sn){r=await hashInternal(p,r);steps&&steps.push({side:"left",sib:p,out:r});if(fn%2===0)while(fn%2===0&&fn!==0){fn=Math.floor(fn/2);sn=Math.floor(sn/2)}}
    else{r=await hashInternal(r,p);steps&&steps.push({side:"right",sib:p,out:r})}
    fn=Math.floor(fn/2);sn=Math.floor(sn/2)}
  return sn===0?r:"";
}
// RFC 9162 §2.1.4.2 consistency proof verification.
async function verifyConsistency(first,second,fh,sh,proof){
  if(first===second)return proof.length===0&&fh===sh;
  if(first<1||first>second||!proof.length)return false;
  const path=(first&(first-1))===0?[fh,...proof]:[...proof];
  let fn=first-1,sn=second-1;while(fn&1){fn>>=1;sn>>=1}
  let fr=path[0],sr=path[0];
  for(const c of path.slice(1)){if(sn===0)return false;
    if(fn&1||fn===sn){fr=await hashInternal(c,fr);sr=await hashInternal(c,sr);if(!(fn&1))while(!(fn&1)&&fn!==0){fn>>=1;sn>>=1}}
    else sr=await hashInternal(sr,c);
    fn>>=1;sn>>=1}
  return sn===0&&fr===fh&&sr===sh;
}
const SPKI="302a300506032b6570032100";
function pemRaw(pem){const m=/-----BEGIN PUBLIC KEY-----([\s\S]+?)-----END PUBLIC KEY-----/.exec(pem||"");if(!m)throw new Error("no PEM");const bin=atob(m[1].replace(/\s+/g,""));const d=Uint8Array.from(bin,c=>c.charCodeAt(0));if(d.length!==44||toHex(d.subarray(0,12))!==SPKI)throw new Error("not Ed25519 SPKI");return d.slice(12)}
let nobleP=null;
async function makeVerifier(pem){
  const raw=pemRaw(pem);const kid=(await sha256Hex(raw)).slice(0,16);
  try{const key=await crypto.subtle.importKey("raw",raw,{name:"Ed25519"},false,["verify"]);
    return{kid,engine:"WebCrypto Ed25519",verify:async(sig,msg)=>/^[0-9a-f]{128}$/.test(sig)&&crypto.subtle.verify({name:"Ed25519"},key,fromHex(sig),msg)}}
  catch{nobleP??=import("https://cdn.jsdelivr.net/npm/@noble/ed25519@2.1.0/+esm");const ed=await nobleP;
    return{kid,engine:"noble-ed25519",verify:async(sig,msg)=>/^[0-9a-f]{128}$/.test(sig)&&ed.verifyAsync(fromHex(sig),msg,raw)}}
}

// ─────────────────────────── loading ───────────────────────────
const Q=new URLSearchParams(location.search);
const API=(Q.get("api")||"https://filet-call.anikethsubs.workers.dev").replace(/\/$/,"");
const PRESENTER=Q.get("presenter");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PKG=null, V=null, SEL=0, DISC={};

function setStatus(t){$("#loadst").textContent=t||""}

async function fetchPackage(id){
  setStatus("fetching package…");
  const r=await fetch(`${API}/call/${encodeURIComponent(id)}/package`,{cache:"no-store"});
  if(r.ok)return r.json();
  if(r.status!==404)throw new Error(`package: HTTP ${r.status}`);
  // /package not deployed for this call yet: rebuild it from the call's own event stream.
  setStatus("package endpoint unavailable, replaying call events…");
  return packageFromSSE(id);
}

async function packageFromSSE(id){
  const ctl=new AbortController();const evs=[];
  const r=await fetch(`${API}/call/${encodeURIComponent(id)}/events`,{signal:ctl.signal,headers:{accept:"text/event-stream"}});
  if(!r.ok)throw new Error(`events: HTTP ${r.status}`);
  const rd=r.body.getReader();const dec=new TextDecoder();let buf="",idle;
  const done=new Promise(res=>{const kick=()=>{clearTimeout(idle);idle=setTimeout(()=>{ctl.abort();res()},4000)};kick();
    (async()=>{try{for(;;){const{done,value}=await rd.read();if(done)break;kick();buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf("\n\n"))>=0){const blk=buf.slice(0,i);buf=buf.slice(i+2);let ev="message",data="";
        for(const ln of blk.split("\n")){if(ln.startsWith("event:"))ev=ln.slice(6).trim();else if(ln.startsWith("data:"))data+=ln.slice(5).trim()}
        if(data)try{evs.push({event:ev,data:JSON.parse(data)})}catch{}
        if(ev==="done"){setTimeout(()=>{ctl.abort();res()},1500)}}}}catch{}res()})()});
  await done;
  const p=packageFromEvents(evs,{});p.call_id=id;p.source="replayed from /call/:id/events";
  return p;
}

// Build a package from an event stream (recorded run or live replay). Only signed receipts are
// verified; anything taken from the stream itself is marked as such.
function packageFromEvents(evs,disclose){
  const start=(evs.find(e=>e.event==="start")||{}).data||{};
  const transcript=evs.filter(e=>e.event==="turn").map(e=>({at:e.data.at,who:e.data.who,text:e.data.text}));
  const signed=evs.filter(e=>e.event==="signed").map(e=>e.data).sort((a,b)=>a.seq-b.seq);
  const anch={};for(const e of evs)if(e.event==="anchored")anch[e.data.receipt_id]=e.data;
  const decs={};for(const e of evs)if(e.event==="decision"&&e.data.step!=null)decs[e.data.step]=e.data;
  const tools={};for(const e of evs)if(e.event==="tool_result"&&e.data.step!=null)(tools[e.data.step]??=[]).push(e.data);
  const receipts=signed.map(s=>{const r={...s.receipt};const a=anch[s.receipt_id];
    if(a)r.log_inclusion_proof=a.log_inclusion_proof||{log_id:a.log_id||start.log_id,leaf_hash:a.leaf_hash,leaf_index:a.leaf_index,tree_size:a.tree_size,
      audit_path:(a.audit_path||[]).map(x=>typeof x==="string"?x:x.hash),sth:a.sth,sth_signature:a.sth_signature};
    const d=decs[s.step];
    if(d&&!(r.evidence&&r.evidence.reasoning)&&String(r.action).startsWith("decide:"))
      Object.defineProperty(r,"_stream_reasoning",{value:{_tools:tools[s.step]||[],question:null,claims:d.claims||[],decision:d.decision_record?.decision,rule_id:d.decision_record?.rule_id,uncertainty:d.decision_record?.uncertainty},enumerable:false});
    return r});
  const first=receipts[0]?.observed_at;
  return{call_id:start.call_id||start.plan_id||"recorded",started_at:first||null,ended_at:null,rules:start.rules||{},transcript,receipts,
    authority:{origin:null,log_id:start.log_id,public_key_pem:start.log_public_key_pem||null,sth:null},
    issuer_public_key_pem:start.issuer_public_key_pem||null,issuer_key_id:start.issuer_key_id,_disclose:disclose};
}

async function loadRecorded(){
  setStatus("loading recorded run…");
  const j=await (await fetch("events.json",{cache:"no-store"})).json();
  const runs=j.runs||{};const evs=runs[""]||Object.values(runs)[0]||j.events||[];
  const p=packageFromEvents(evs,j.disclose||{});p.recorded=true;return p;
}

// ─────────────────────────── verification (all in-browser) ───────────────────────────
async function verifyPackage(pkg){
  const rs=pkg.receipts||[];const out={per:[],live:null,engine:""};
  let iss=null,logv=null;
  try{if(pkg.issuer_public_key_pem){iss=await makeVerifier(pkg.issuer_public_key_pem);out.engine=iss.engine}}catch(e){out.issErr=e.message}
  try{if(pkg.authority?.public_key_pem)logv=await makeVerifier(pkg.authority.public_key_pem)}catch(e){out.logErr=e.message}
  let prevHash=null,prevSeq=null;
  for(let i=0;i<rs.length;i++){
    const r=rs[i];const v={i,why:[]};out.per.push(v);
    let pb;try{pb=payloadBytes(r)}catch(e){v.sig="fail";v.why.push("not canonicalizable: "+e.message);prevHash=null;continue}
    v.bytes=pb.length;v.hash=await sha256Hex(pb);
    // signature
    if(!iss)v.sig="nokey";
    else{v.sig=(await iss.verify(String(r.signature||""),pb))?"ok":"fail";if(v.sig==="fail")v.why.push("signature");
      v.kid=r.key_id===iss.kid?"ok":"fail";if(v.kid==="fail")v.why.push("key_id ≠ issuer key")}
    // evidence hash
    try{v.ev=(await sha512Hex(canonBytes(r.evidence)))===r.evidence_hash_sha512?"ok":"fail"}catch{v.ev="fail"}
    if(v.ev==="fail")v.why.push("evidence hash");
    // chain link
    if(i===0){v.chain="previous_receipt_hash" in r?"fail":"genesis";if(v.chain==="fail")v.chainWhy="genesis carries previous_receipt_hash"}
    else{v.chain=r.previous_receipt_hash===prevHash?"ok":"fail";if(v.chain==="fail")v.chainWhy=`previous_receipt_hash ≠ sha256(receipt #${i})`}
    if(typeof r.seq==="number"){if(prevSeq!==null&&r.seq!==prevSeq+1){v.chain="fail";v.chainWhy=(v.chainWhy?v.chainWhy+"; ":"")+`seq gap ${prevSeq}→${r.seq}`}prevSeq=r.seq}
    prevHash=v.hash;
    // inclusion
    const p=r.log_inclusion_proof;v.anchored=!!(p&&typeof p==="object");
    if(v.anchored){
      v.leafCalc=await leafHash(pb);v.leaf=v.leafCalc===p.leaf_hash?"ok":"fail";
      v.steps=[];let root="";try{root=await walkAuditPath(p.leaf_hash,p.audit_path||[],p.leaf_index??0,p.tree_size,v.steps)}catch{}
      v.root=root;v.path=root&&root===p.sth?.root_hash?"ok":"fail";
      if(!logv)v.sthSig="nokey";else{try{v.sthSig=(await logv.verify(String(p.sth_signature||""),canonBytes(p.sth)))?"ok":"fail"}catch{v.sthSig="fail"}}
      v.proof=(v.leaf==="ok"&&v.path==="ok"&&v.sthSig!=="fail")?"ok":"fail";
      if(v.leaf==="fail")v.why.push("leaf hash");if(v.path==="fail")v.why.push("audit path");if(v.sthSig==="fail")v.why.push("STH signature");
    }
  }
  out.live=await checkLive(pkg,logv);
  return out;
}

async function checkLive(pkg,logv){
  const origin=pkg.authority?.origin;
  if(!origin)return{state:"na",why:pkg.recorded?"recorded run: its log was a local authority, not the live one":"package names no authority"};
  try{
    const [kr,sr]=await Promise.all([fetch(origin+"/authority/v1/key",{cache:"no-store"}),fetch(origin+"/authority/v1/sth",{cache:"no-store"})]);
    const key=await kr.json(),live=await sr.json();
    const res={state:"ok",origin,liveSize:live.sth.tree_size,liveRoot:live.sth.root_hash,per:{},why:""};
    if(!pkg.authority.public_key_pem||toHex(pemRaw(key.public_key_pem))!==toHex(pemRaw(pkg.authority.public_key_pem))){res.state="fail";res.why="authority key differs from the package's";return res}
    if(!logv||!(await logv.verify(live.sth_signature,canonBytes(live.sth)))){res.state="fail";res.why="live STH signature invalid";return res}
    const sths=new Map();for(const r of pkg.receipts){const s=r.log_inclusion_proof?.sth;if(s&&!sths.has(s.tree_size))sths.set(s.tree_size,s)}
    for(const [n,s] of sths){
      let ok;
      if(n>live.sth.tree_size)ok=false;
      else if(n===live.sth.tree_size)ok=s.root_hash===live.sth.root_hash;
      else{const c=await (await fetch(`${origin}/authority/v1/consistency?from=${n}&to=${live.sth.tree_size}`,{cache:"no-store"})).json();
        ok=await verifyConsistency(n,live.sth.tree_size,s.root_hash,live.sth.root_hash,c.proof||[])}
      res.per[n]=ok;if(!ok){res.state="fail";res.why=`tree head ${n} is not a prefix of the live log`}
    }
    res.count=sths.size;return res;
  }catch(e){return{state:"unreach",why:`authority unreachable (${e.message})`}}
}

// ─────────────────────────── helpers over the package ───────────────────────────
function rulesMap(p){const r=p.rules||{};if(Array.isArray(r)){const m={};for(const x of r)m[x.id]=x.text;return m}return r}
function reasoningOf(r){return r.evidence?.reasoning||r._stream_reasoning||null}
function txt(t){return t&&typeof t==="object"&&"withheld" in t?`<span class="dim mono">[withheld: ${esc(t.withheld)}]</span>`:esc(t)}
function mmss(r){const b=Date.parse(PKG.started_at||PKG.receipts[0]?.observed_at);const t=Date.parse(r.observed_at);if(!isFinite(b)||!isFinite(t))return"";const s=Math.max(0,Math.round((t-b)/1000));return`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function rowInfo(r){
  const a=String(r.action||"");const rs=reasoningOf(r);const dr=r.evidence?.decision_record;const ev=r.evidence||{};
  if(rs)return{d:rs.decision,rule:rs.rule_id,minor:false};
  if(dr)return{d:dr.decision,rule:dr.rule_id,minor:false};
  if(a==="model:iteration")return{d:`model turn ${ev.turn??"?"}.${ev.iteration??"?"}${ev.tool_uses?.length?" → "+ev.tool_uses.join(", "):""}`,rule:ev.stop_reason||"",minor:true};
  if(a==="close")return{d:"chain close",rule:"",minor:true};
  return{d:a,rule:r.policy_reason||"",minor:true};
}
const MK={ok:'<span class="ok">✓</span>',genesis:'<span class="ok">✓</span>',fail:'<span class="bad">✗</span>',nokey:'<span class="warn">–</span>',na:'<span class="warn">–</span>',unreach:'<span class="warn">?</span>'};
function rStatus(v){if(!v)return"";if(v.why.length||v.chain==="fail")return"fail";if(v.sig==="nokey")return"nokey";return"ok"}
function rName(i){const r=PKG.receipts[i];return`#${i+1} ${r.action}`}

// ─────────────────────────── render: left ───────────────────────────

  rows.push({s:prBad.length?"fail":sthNo?"na":un.length===n?"na":"ok",t:"Inclusion proofs valid",why:prBad.length?prBad.map(v=>`${link(v.i)}: ${esc(v.why.filter(w=>/leaf|path|STH/.test(w)).join(", "))}`).join("<br>"):sthNo?"audit paths walk to the root; log key not in this package":"RFC 6962 audit path → signed tree head"});
  const L=V.live;
  rows.push({s:L.state,t:"Tree head matches live authority",why:L.state==="ok"?`${L.count} tree head${L.count===1?"":"s"} consistent with live size ${L.liveSize}`:esc(L.why)});

}

// ─────────────────────────── render: right (the fillet) ───────────────────────────
function jsonHTML(v,path,ind){
  const pad="  ".repeat(ind);
  if(v===null)return'<span class="jz">null</span>';
  if(typeof v==="string")return`<span class="js">${esc(JSON.stringify(v))}</span>`;
  if(typeof v==="number")return`<span class="jn">${v}</span>`;
  if(typeof v==="boolean")return`<span class="jb">${v}</span>`;
  if(Array.isArray(v)){if(!v.length)return"[]";return"[\n"+v.map((x,i)=>pad+"  "+jsonHTML(x,`${path}[${i}]`,ind+1)).join(",\n")+"\n"+pad+"]"}
  const ks=Object.keys(v);if(!ks.length)return"{}";
  return"{\n"+ks.map(k=>{const p=path?`${path}.${k}`:k;const j=JUMP(p);
    return`${pad}  <span class="jk${j?" lnk":""}"${j?` data-jump="${esc(j)}"`:""}>${esc(JSON.stringify(k))}</span>: ${jsonHTML(v[k],p,ind+1)}`}).join(",\n")+"\n"+pad+"}";
}
function JUMP(p){
  let m;
  if(p==="previous_receipt_hash")return"prev";
  if(p==="signature"||p==="key_id")return"#p-sig";
  if(p==="evidence_hash_sha512")return"#p-ev";
  if(p==="log_inclusion_proof"||p.startsWith("log_inclusion_proof."))return"#p-inc";
  if(p==="reasoning_hash"||p==="commitment_alg")return"#p-disc";
  if(p==="evidence.reasoning.question")return"#f-q";
  if(p==="evidence.reasoning.decision"||p==="evidence.reasoning.rule_id")return"#f-dec";
  if((m=/^evidence\.reasoning\.claims\[(\d+)\]$/.exec(p)))return"#claim-"+m[1];
  return null;
}

function questionLine(r,rs){
  // the caller line this decision answers: first turn cite, else the caller's Nth line
  for(const c of rs?.claims||[])for(const x of c.cites||[])if(x.kind==="turn"){const t=(PKG.transcript||[]).find(t=>t.at===x.ref&&t.who==="caller");if(t)return t}
  const n=r.evidence?.turn??r.evidence?.decision_record?.turn;
  const callers=(PKG.transcript||[]).filter(t=>t.who==="caller");
  return n?callers[n-1]:null;
}

function citeHTML(x,rs){
  const R=rulesMap(PKG);let ref=esc(x.ref),body="",loc="",unres=x.resolved===false||(x.value===null&&"value" in x);
  let val=x.value;
  if(!("value" in x)||x.value===undefined){loc='<span class="loc">resolved from package</span>';
    if(x.kind==="rule")val=R[x.ref];
    else if(x.kind==="turn"){const t=(PKG.transcript||[]).find(t=>t.at===x.ref);val=t?`${t.who==="caller"?"Caller":"Ava"} (${t.at}): ${t.text}`:undefined}
    else if(x.kind==="claim"){const c=(rs.claims||[]).find(c=>c.id===x.ref);val=c?.text}
    else if(x.kind==="tool"&&rs._tools){for(const t of rs._tools){const r=t.result||{};if(r&&typeof r==="object"&&x.ref in r){val=r[x.ref];loc='<span class="loc">from recorded '+esc(t.name)+' result</span>';break}}}
    if(val===undefined){unres=true;loc=""}}
  if(x.kind==="rule"){ref=`<span class="ref">${esc(x.ref)}</span>`;body=val!=null?txt(val):""}
  else if(x.kind==="turn"){ref=`<a class="ref" data-at="${esc(x.ref)}">${esc(x.ref)}</a>`;body=val!=null?`<span style="font-style:italic">“${txt(typeof val==="string"?val.replace(/^(Caller|Ava) \([0-9:]+\): /,""):val)}”</span>`:""}
  else if(x.kind==="claim"){const ci=(rs.claims||[]).findIndex(c=>c.id===x.ref);ref=`<a class="ref" data-jump="#claim-${ci}">${esc(x.ref)}</a>`;body=val!=null?`<span class="muted">builds on: </span>${txt(val)}`:""}
  else if(x.kind==="tool"){ref=`<span class="ref">${esc(x.ref)}</span>`;body=val!==undefined&&val!==null?`= <span class="val">${esc(typeof val==="string"?val:JSON.stringify(val))}</span>`:""}
  return`<div class="cite" data-kind="${esc(x.kind)}"><span class="k">${esc(x.kind)}</span><span class="v">${ref}${body}${unres?'<span class="unres">✗ unresolved</span>':""}${loc}</span></div>`;
}

function proofHTML(i){
  const r=PKG.receipts[i],v=V.per[i],p=r.log_inclusion_proof;const h=s=>esc(String(s||"").slice(0,16))+"…";
  const rows=[];

  if(!v.anchored)rows.push(`<div class="pr" id="p-inc"><span class="mk">${MK.fail}</span><span class="nm">Authority log</span><span class="dt">no inclusion proof</span></div>`);
  else{
    const L=V.live;const n=p.sth?.tree_size;const liveOk=L.state==="ok"?MK[L.per[n]?"ok":"fail"]:MK[L.state]||MK.na;
    rows.push(`<div class="pr" id="p-inc"><span class="mk">${MK[v.proof]}</span><span class="nm">Inclusion in authority log</span><span class="dt">
      log ${esc(p.log_id)} · leaf ${p.leaf_index} of ${p.tree_size}<br>
      ${MK[v.leaf]} leaf = sha256(0x00‖payload) = ${h(v.leafCalc)}
      <div class="path">${(v.steps||[]).map((s,k)=>`<div><span class="sd">${k+1} ${s.side==="left"?"L":"R"}</span><span>${h(s.sib)} → ${h(s.out)}</span></div>`).join("")||'<div><span class="sd">—</span><span>single-leaf tree</span></div>'}</div>
      ${MK[v.path]} root ${h(v.root)} ${v.path==="ok"?"=":"≠"} STH root ${h(p.sth?.root_hash)}<br>
      ${MK[v.sthSig]} STH signed by log key · ${esc(p.sth?.timestamp)}<br>
      ${liveOk} STH ${n} ${L.state==="ok"?`consistent with live tree head ${L.liveSize} (${h(L.liveRoot)})`:esc(L.why||"")}

function discHTML(i){

async function disclose(id){
  const r=PKG.receipts.find(x=>x.id===id);
  try{let d=PKG._disclose?.[id];
    if(!d){const res=await fetch(`${API}/disclose/${encodeURIComponent(id)}`,{headers:{authorization:`Bearer ${PRESENTER}`}});if(!res.ok)throw new Error(`disclose: HTTP ${res.status}`);d=await res.json()}
    const calc=await sha256Hex(`${d.salt}:${d.text}`);DISC[id]={ok:calc===r.reasoning_hash,salt:d.salt,text:d.text}}
  catch(e){DISC[id]={err:e.message}}

$("#btnCopy").onclick=async()=>{try{await navigator.clipboard.writeText($("#dlTa").value);$("#btnCopy").textContent="Copied"}catch{$("#dlTa").select()}};
async function useText(s,label){
  try{const p=JSON.parse(s);if(!p||!Array.isArray(p.receipts))throw new Error("not a package: no receipts array");
    $("#mLoad").classList.remove("on");await show(p,label)}catch(e){$("#err").textContent=e.message}}
$("#btnVerify").onclick=()=>useText($("#pasteTa").value,"pasted");
$("#file").onchange=async e=>{const f=e.target.files[0];if(f)useText(await f.text(),f.name)};
const dz=$("#drop");
for(const tgt of [dz,document.body]){
  tgt.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over")});
  tgt.addEventListener("dragleave",()=>dz.classList.remove("over"));
  tgt.addEventListener("drop",async e=>{e.preventDefault();dz.classList.remove("over");const f=e.dataTransfer.files[0];if(f){$("#mLoad").classList.add("on");useText(await f.text(),f.name)}});
}

async function show(pkg,label){
  PKG=pkg;DISC={};setStatus("verifying…");delete document.body.dataset.ready;
  $("#checks").innerHTML='<div class="check"><span class="mk dim">…</span><span class="t muted">verifying</span></div>';$("#list").innerHTML="";$("#right").innerHTML='<div class="empty">verifying…</div>';
  $("#callid").textContent=`${pkg.call_id||""}${label?" · "+label:""}${pkg.source?" · "+pkg.source:""}`;
  $("#rectag").hidden=!pkg.recorded;
  V=await verifyPackage(pkg);
  const h=/^#r(\d+)$/.exec(location.hash);
  SEL=h?Math.min(+h[1]-1,pkg.receipts.length-1):Math.max(0,pkg.receipts.findIndex(r=>String(r.action).startsWith("decide:")));
  renderChecks();renderList();renderRight();
  setStatus(V.engine?`${V.engine} · ${pkg.receipts.length} receipts`:"");
  document.body.dataset.ready="1";
}

(async()=>{
  try{const id=Q.get("call");await show(id?await fetchPackage(id):await loadRecorded(),id?"":"")}
  catch(e){setStatus("");$("#right").innerHTML=`<div class="empty bad">${esc(e.message)}</div>`;document.body.dataset.ready="err"}
})();
</script>
</body>
</html>
