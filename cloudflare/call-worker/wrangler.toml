name = "filet-call"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[durable_objects.bindings]]
name = "CALL"
class_name = "CallDO"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallDO", "RateLimiter"]

# Signing is isolated in filet-signer; this Worker never holds ISSUER_PRIVATE_KEY.
[[services]]
binding = "SIGNER"
service = "filet-signer"

[[services]]
binding = "AUTHORITY"
service = "filet-authority"

# Secrets (wrangler secret put): ANTHROPIC_API_KEY, REGISTRATION_TOKEN, DISCLOSE_TOKEN
# Optional var: TRACE_URL_TEMPLATE, e.g. "https://ui.honeycomb.io/.../trace?trace_id={trace_id}&span={span_id}"

[[durable_objects.bindings]]
name = "CALL_INDEX"
class_name = "CallIndex"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CallIndex"]

[vars]
AUTHORITY_ORIGIN = "https://filet-authority.anikethsubs.workers.dev"
